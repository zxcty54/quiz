name: Build MockTester Offline Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components & NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Clean & Force Android Scaffold
        working-directory: flutter_app
        run: |
          rm -rf android/app/src/main/java
          flutter create . --platforms=android --org com --project-name testing

      - name: Configure Global Gradle Properties
        working-directory: flutter_app/android
        run: |
          cat << 'EOF' >> gradle.properties
          android.useAndroidX=true
          android.enableJetifier=false
          android.suppressUnsupportedCompileSdk=36,Baklava
          android.experimental.disableCompileSdkChecks=true
          EOF

      - name: Inject Clean Flutter MainActivity.kt
        run: |
          mkdir -p flutter_app/android/app/src/main/kotlin/com/testing
          cat << 'EOF' > flutter_app/android/app/src/main/kotlin/com/testing/MainActivity.kt
          package com.testing

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

      - name: Inject Valid AndroidManifest.xml
        run: |
          cat << 'EOF' > flutter_app/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.testing">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>
              <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
              <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
              <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
              <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>

              <application
                  android:label="MockTester"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:requestLegacyExternalStorage="true"
                  android:largeHeap="true"
                  android:hardwareAccelerated="true">

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Setup Build Configuration & SO Packaging
        working-directory: flutter_app
        run: |
          flutter pub get

          # Packaging fix for libmtmd.so and API 36 inside build.gradle.kts
          APP_KTS="android/app/build.gradle.kts"
          if [ -f "$APP_KTS" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$APP_KTS"
            sed -i 's/compileSdk = 34/compileSdk = 36/g' "$APP_KTS"
            
            sed -i '/android {/a \    packaging {\n        resources {\n            pickFirsts.add("**/libmtmd.so")\n            pickFirsts.add("**/libllama.so")\n            pickFirsts.add("**/libc++_shared.so")\n        }\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }' "$APP_KTS"
          fi

      - name: Setup Keystore & Permissions
        working-directory: flutter_app/android
        run: |
          chmod +x gradlew || true
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keypass android \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            || true

      - name: Build Pure Offline Release APK via Flutter
        working-directory: flutter_app
        run: flutter build apk --release --target-platform=android-arm64 --no-tree-shake-icons

      - name: Locate & Package APK
        working-directory: flutter_app
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK_FILE=$(find build/app/outputs -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk
          cp "$APK_FILE" build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} (llama.cpp GGUF Core) APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
