name: mocktester_v2
description: "MockTester v2 — BPSC / BSSC / Bihar State exam CBT practice app (feature-first architecture)."
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # networking + storage
  http: ^1.2.1
  shared_preferences: ^2.3.2
  path_provider: ^2.1.4
  path: ^1.9.0

  # ui
  shimmer: ^3.0.0
  fl_chart: ^0.68.0
  flutter_math_fork: ^0.7.2
  cached_network_image: ^3.3.1
  url_launcher: ^6.3.0

  # device + platform
  device_info_plus: ^11.1.0
  app_links: ^6.3.2
  share_plus: ^10.0.0

  # files, media, pdf
  file_picker: ^8.1.2
  file_saver: ^0.2.14
  image_picker: ^1.1.2
  image: ^4.5.4
  flutter_image_compress: ^2.3.0
  pdf: ^3.11.1
  printing: ^5.13.1
  archive: ^4.0.2
  google_mlkit_text_recognition: ^0.13.0

  # backend
  supabase_flutter: ^2.6.0
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^17.2.3
  firebase_in_app_messaging: ^0.8.0+4
  google_sign_in: ^6.2.1

  # local db (kept for offline packs)
  sqflite: ^2.3.3+1
  sqlite3_flutter_libs: ^0.5.24

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 23
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"

flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/
    - assets/icon/
