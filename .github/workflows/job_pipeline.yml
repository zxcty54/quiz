name: Auto Bihar & Central Jobs Pipeline

on:
  schedule:
    # Daily Subah 7:00 AM IST (1:30 AM UTC)
    - cron: '30 1 * * *'
  workflow_dispatch: # GitHub UI me Manual Run ke liye

permissions:
  contents: write # Repository me Push & Write permissions allow karta hai

jobs:
  run-jobs-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Conflict-free rebase ke liye

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi beautifulsoup4 groq lxml PyMuPDF cloudscraper

      # 1️⃣ FreeJobAlert Scraper (UNTOUCHED)
      - name: Run Main Job Scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python job_scraper.py

      # 2️⃣ SarkariResult Scraper (Generates sarkarijob.json)
      - name: Run SarkariResult Scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python test_sarkari.py

      # 3️⃣ Auto-Commit and Push Both JSON Files
      - name: Auto-Commit and Push Updated Jobs JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          
          # Adding both JSON files to Git tracking
          git add bihar_jobs.json sarkarijob.json
          
          # Conflict se bachne ke liye pull-rebase step
          git pull origin main --rebase || true
          
          git diff-index --quiet HEAD || git commit -m "Auto-update Bihar & Sarkari Jobs JSON [skip ci]"
          git push origin main
