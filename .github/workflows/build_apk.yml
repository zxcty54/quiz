name: Build MockTester Offline Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components & NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Clean & Force Android Scaffold
        working-directory: flutter_app
        run: |
          rm -rf android/app/src/main/java
          flutter create . --platforms=android --org com --project-name testing

      - name: Configure Global Gradle Properties
        working-directory: flutter_app/android
        run: |
          echo "android.useAndroidX=true" >> gradle.properties
          echo "android.enableJetifier=false" >> gradle.properties
          echo "android.suppressUnsupportedCompileSdk=36,Baklava" >> gradle.properties
          echo "android.experimental.disableCompileSdkChecks=true" >> gradle.properties

      - name: Inject Clean Flutter MainActivity.kt
        run: |
          mkdir -p flutter_app/android/app/src/main/kotlin/com/testing
          echo "package com.testing" > flutter_app/android/app/src/main/kotlin/com/testing/MainActivity.kt
          echo "import io.flutter.embedding.android.FlutterActivity" >> flutter_app/android/app/src/main/kotlin/com/testing/MainActivity.kt
          echo "class MainActivity: FlutterActivity() {}" >> flutter_app/android/app/src/main/kotlin/com/testing/MainActivity.kt

      - name: Setup Build Configuration, Permissions & Native SO Packaging
        working-directory: flutter_app
        run: |
          flutter pub get

          # 1. Update android/app/build.gradle.kts (API 36 & Packaging)
          APP_KTS="android/app/build.gradle.kts"
          if [ -f "$APP_KTS" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$APP_KTS"
            sed -i 's/compileSdk = 34/compileSdk = 36/g' "$APP_KTS"
            
            # Add packaging block for native SO files
            sed -i '/android {/a \    packaging {\n        resources {\n            pickFirsts.add("**/libmtmd.so")\n            pickFirsts.add("**/libllama.so")\n            pickFirsts.add("**/libc++_shared.so")\n        }\n        jniLibs {\n            useLegacyPackaging = true\n        }\n    }' "$APP_KTS"
          fi

          # 2. Inject Storage Permissions into AndroidManifest.xml
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            PERMS='    <uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>'
            sed -i "/<manifest/a $PERMS" "$MANIFEST"
            sed -i 's/<application/<application android:requestLegacyExternalStorage="true" android:largeHeap="true"/g' "$MANIFEST"
            sed -i '/<\/application>/i \        <meta-data android:name="flutterEmbedding" android:value="2" />' "$MANIFEST"
          fi

      - name: Setup Keystore & Permissions
        working-directory: flutter_app/android
        run: |
          chmod +x gradlew || true
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keypass android \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            || true

      - name: Build Pure Offline Release APK via Flutter
        working-directory: flutter_app
        run: flutter build apk --release --target-platform=android-arm64 --no-tree-shake-icons

      - name: Locate & Package APK
        working-directory: flutter_app
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK_FILE=$(find build/app/outputs -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk
          cp "$APK_FILE" build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} (llama.cpp GGUF Core) APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
