name: Build MockTester Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Re-generate Native Android Project Files
        working-directory: flutter_app
        run: flutter create . --platforms=android --org com --project-name testing

      - name: 📦 Get Flutter Dependencies
        working-directory: flutter_app
        run: |
          flutter pub get
          flutter pub deps

      - name: 🎨 Generate App Icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons || true

      - name: 🔧 Auto-Patch Gradle, Desugaring & Google Services
        run: |
          # 1. Package Name Patch
          find flutter_app/android/ -type f -name "build.gradle" -exec sed -i 's/applicationId .*/applicationId "com.testing"/g' {} +
          find flutter_app/android/ -type f -name "build.gradle" -exec sed -i 's/namespace .*/namespace "com.testing"/g' {} +
          find flutter_app/android/ -type f -name "build.gradle.kts" -exec sed -i 's/applicationId = .*/applicationId = "com.testing"/g' {} +
          find flutter_app/android/ -type f -name "build.gradle.kts" -exec sed -i 's/namespace = .*/namespace = "com.testing"/g' {} +

          # 2. CompileSDK 36 Patch
          find flutter_app/android/ ~/.pub-cache/ -type f -name "*.kts" -exec sed -i 's/compileSdk.*/compileSdk = 36/g' {} +
          find flutter_app/android/ ~/.pub-cache/ -type f -name "build.gradle" -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' {} +
          find flutter_app/android/ ~/.pub-cache/ -type f -name "build.gradle" -exec sed -i 's/compileSdk .*/compileSdk 36/g' {} +

          # 3. Settings Gradle Plugin Injection
          if [ -f flutter_app/android/settings.gradle ]; then
            sed -i 's/plugins {/plugins {\n    id "com.google.gms.google-services" version "4.4.2" apply false/' flutter_app/android/settings.gradle
          elif [ -f flutter_app/android/settings.gradle.kts ]; then
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services") version "4.4.2" apply false/' flutter_app/android/settings.gradle.kts
          fi

          # 4. Desugaring & Google Services Injection
          if [ -f flutter_app/android/app/build.gradle ]; then
            sed -i 's/plugins {/plugins {\n    id "com.google.gms.google-services"/' flutter_app/android/app/build.gradle
            sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' flutter_app/android/app/build.gradle
            printf '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n' >> flutter_app/android/app/build.gradle
          elif [ -f flutter_app/android/app/build.gradle.kts ]; then
            sed -i 's/plugins {/plugins {\n    id("com.google.gms.google-services")/' flutter_app/android/app/build.gradle.kts
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' flutter_app/android/app/build.gradle.kts
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n' >> flutter_app/android/app/build.gradle.kts
          fi

      # 🔑 1. Generate Keystore & Print SHA-1 Key
      - name: 🔑 Extract & Print SHA-1 Key
        working-directory: flutter_app/android
        run: |
          mkdir -p ~/.config/.android
          keytool -genkey -v -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey -storepass android -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          ./gradlew signingReport

      # 🛠️ 2. Build Release APK (With DB Assets Included)
      - name: 🛠️ Build APK (With Secrets Injected)
        working-directory: flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} \
            --dart-define=GOOGLE_API_KEY2=${{ secrets.GOOGLE_API_KEY2 }} \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }} \
            --dart-define=GROQ_API_KEY2=${{ secrets.GROQ_API_KEY2 }}

      - name: 📤 Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      # 📦 3. Auto Rename & Maximum Zip Compression
      - name: 📦 Auto-Rename APK & Compress
        working-directory: flutter_app
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      # 📱 4. Send Unique Zip To Telegram
      - name: 📱 Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 *MockTester Build #${{ github.run_number }} APK Ready!*\n\n📦 File: `MockTester_Build_${{ github.run_number }}.zip`\n✨ Unzip karke direct install karein (No duplicate conflict)."
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
