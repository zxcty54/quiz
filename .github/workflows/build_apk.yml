name: "Build MockTester Offline Android APK"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components & NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Clean & Force Android Scaffold
        working-directory: flutter_app
        run: |
          rm -rf android/app/src/main/java
          flutter create . --platforms=android --org com --project-name testing

      - name: Configure Global Gradle Properties
        working-directory: flutter_app/android
        run: |
          cat << 'EOF' >> gradle.properties
          android.useAndroidX=true
          android.enableJetifier=false
          android.suppressUnsupportedCompileSdk=36,Baklava
          android.experimental.disableCompileSdkChecks=true
          EOF

      - name: Inject Clean Flutter MainActivity.kt
        run: |
          mkdir -p flutter_app/android/app/src/main/kotlin/com/testing
          cat << 'EOF' > flutter_app/android/app/src/main/kotlin/com/testing/MainActivity.kt
          package com.testing

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              // llama_cpp_dart handles FFI bindings directly
          }
          EOF

      - name: Setup Build Configuration & Inject v2 Embedding
        working-directory: flutter_app
        run: |
          flutter pub get
          python3 - << 'EOF'
          import os

          # 1. Update android/app/build.gradle.kts to compileSdk = 36
          app_kts = "android/app/build.gradle.kts"
          if os.path.exists(app_kts):
              with open(app_kts, "r") as f:
                  content = f.read()
              
              content = content.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              content = content.replace("compileSdk = 34", "compileSdk = 36")
              
              if "isCoreLibraryDesugaringEnabled" not in content:
                  if "compileOptions {" in content:
                      content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
                  else:
                      content = content.replace("android {", "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }")
              
              if "desugar_jdk_libs" not in content:
                  content += """
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
          }
          """
              with open(app_kts, "w") as f:
                  f.write(content)

          # 2. Hook subprojects to compile with API 36 in settings.gradle.kts
          settings_kts = "android/settings.gradle.kts"
          if os.path.exists(settings_kts):
              with open(settings_kts, "a") as f:
                  f.write("""
          gradle.beforeProject {
              plugins.withId("com.android.library") {
                  extensions.findByName("android")?.let { ext ->
                      try {
                          ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      } catch (_: Exception) {}
                  }
              }
              plugins.withId("com.android.application") {
                  extensions.findByName("android")?.let { ext ->
                      try {
                          ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                      } catch (_: Exception) {}
                  }
              }
          }
          """)

          # 3. Inject Flutter v2 Embedding into AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m_content = f.read()

              v2_tag = '\n        <meta-data android:name="flutterEmbedding" android:value="2" />\n'
              if 'android:name="flutterEmbedding"' not in m_content:
                  if "</application>" in m_content:
                      m_content = m_content.replace("</application>", f"{v2_tag}    </application>")
                  elif "<application" in m_content:
                      m_content = m_content.replace("<application", "<application" + v2_tag, 1)

              with open(manifest_path, "w") as f:
                  f.write(m_content)
          print("Build configurations & Android API 36 hooks applied successfully.")
          EOF

      - name: Setup Keystore & Permissions
        working-directory: flutter_app/android
        run: |
          chmod +x gradlew || true
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keypass android \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            || true

      - name: Build Pure Offline Release APK via Flutter
        working-directory: flutter_app
        run: flutter build apk --release --target-platform=android-arm64 --no-tree-shake-icons

      - name: Locate & Package APK
        working-directory: flutter_app
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK_FILE=$(find build/app/outputs -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk
          cp "$APK_FILE" build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} (llama.cpp GGUF Core) APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
