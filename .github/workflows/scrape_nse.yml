name: Scrape NSE Announcements

on:
  schedule:
    # Runs Monday to Friday (UTC):
    # 03:30 UTC = 09:00 AM IST
    # 05:30 UTC = 11:00 AM IST
    # 07:30 UTC = 01:00 PM IST
    # 09:30 UTC = 03:00 PM IST
    # 11:30 UTC = 05:00 PM IST
    - cron: '30 3,5,7,9,11 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip' # Dependencies caching for faster runs

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pypdf pdfplumber

      - name: Run NSE Scraper Script
        run: |
          python nse_announcements_scraper.py

      - name: Commit and Push Announcements Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Dono potential filenames ko stage karega (jo bhi bane)
          git add nse_impact_announcements.json nse_corporate_announcements.json 2>/dev/null || true

          if git diff --staged --quiet; then
            echo "ℹ️ Koi naya update nahi mila. Commit skipped."
          else
            # IST timezone me date format generate karega
            CURRENT_TIME=$(TZ='Asia/Kolkata' date +'%d-%b-%Y %I:%M %p IST')
            git commit -m "📊 Auto-update NSE Announcements: ${CURRENT_TIME}"
            git pull --rebase origin main
            git push origin main
          fi
