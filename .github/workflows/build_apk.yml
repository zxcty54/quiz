name: "Build MockTester Offline Android APK"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components (API 36 & 34)
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "platforms;android-34" "build-tools;36.0.0" "build-tools;34.0.0"

      - name: Rebuild Android Template
        working-directory: flutter_app
        run: |
          rm -rf android/app/src/main/java
          flutter create . --platforms=android --org com --project-name testing

      - name: Set Android Project SDK Properties
        working-directory: flutter_app/android
        run: |
          cat << 'EOF' >> gradle.properties
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          EOF

      - name: Inject MediaPipe MainActivity.kt
        run: |
          mkdir -p flutter_app/android/app/src/main/kotlin/com/testing
          cat << 'EOF' > flutter_app/android/app/src/main/kotlin/com/testing/MainActivity.kt
          package com.testing

          import android.os.Bundle
          import com.google.mediapipe.tasks.genai.llminference.LlmInference
          import io.flutter.embedding.android.FlutterActivity
          import io.flutter.embedding.engine.FlutterEngine
          import io.flutter.plugin.common.MethodChannel
          import java.io.File
          import java.util.concurrent.Executors

          class MainActivity: FlutterActivity() {
              private val CHANNEL = "com.mocktester.ai/offline_llm"
              private var llmInference: LlmInference? = null
              private val executor = Executors.newSingleThreadExecutor()

              override fun configureFlutterEngine(flutterEngine: FlutterEngine) {
                  super.configureFlutterEngine(flutterEngine)

                  MethodChannel(flutterEngine.dartExecutor.binaryMessenger, CHANNEL).setMethodCallHandler { call, result ->
                      when (call.method) {
                          "initModel" -> {
                              val modelPath = call.argument<String>("modelPath")
                              if (modelPath != null && File(modelPath).exists()) {
                                  executor.execute {
                                      try {
                                          llmInference = null
                                          System.gc()

                                          val options = LlmInference.LlmInferenceOptions.builder()
                                              .setModelPath(modelPath)
                                              .setMaxTokens(320)
                                              .build()
                                              
                                          llmInference = LlmInference.createFromOptions(context, options)
                                          runOnUiThread { result.success(true) }
                                      } catch (e: Throwable) {
                                          runOnUiThread { result.error("INIT_FAIL", e.message ?: "Model load failed", null) }
                                      }
                                  }
                              } else {
                                  result.error("FILE_NOT_FOUND", "Model file not found at path", null)
                              }
                          }
                          "generate" -> {
                              val rawPrompt = call.argument<String>("prompt") ?: ""
                              val engine = llmInference
                              
                              if (engine == null) {
                                  result.error("ENGINE_NOT_READY", "Gemma Model Not Initialized", null)
                                  return@setMethodCallHandler
                              }

                              val cleanInput = rawPrompt.trim()
                              if (cleanInput.isEmpty()) {
                                  result.error("EMPTY_PROMPT", "Prompt cannot be empty", null)
                                  return@setMethodCallHandler
                              }

                              executor.execute {
                                  try {
                                      val gemmaFormattedPrompt = "<start_of_turn>user\nYou are a helpful and knowledgeable educational AI assistant.\nAnswer the question clearly with accurate facts, key concepts, and complete explanation.\n\nQuestion: $cleanInput<end_of_turn>\n<start_of_turn>model\n"
                                      val response = engine.generateResponse(gemmaFormattedPrompt)
                                      
                                      runOnUiThread {
                                          if (!response.isNullOrBlank()) {
                                              val cleanResponse = response
                                                  .replace("<start_of_turn>model", "")
                                                  .replace("<end_of_turn>", "")
                                                  .replace("<eos>", "")
                                                  .trim()
                                              result.success(cleanResponse)
                                          } else {
                                              result.error("EMPTY_RESPONSE", "Engine returned no output", null)
                                          }
                                      }
                                  } catch (e: Throwable) {
                                      runOnUiThread { 
                                          result.error("GEN_FAIL", e.localizedMessage ?: "Inference execution error", null) 
                                      }
                                  }
                              }
                          }
                          else -> result.notImplemented()
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  executor.shutdown()
                  llmInference = null
              }
          }
          EOF

      - name: Get Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Inject Strict CompileSDK 36 & MediaPipe Dependencies
        run: |
          python3 - << 'EOF'
          import os
          import re

          # 1. Pub Cache ke andar har plugin me compileSdk 36 enforce karein
          pub_cache_dir = os.path.expanduser("~/.pub-cache/hosted/pub.dev")
          if os.path.exists(pub_cache_dir):
              for root, _, files in os.walk(pub_cache_dir):
                  for file in files:
                      if file in ["build.gradle", "build.gradle.kts"]:
                          filepath = os.path.join(root, file)
                          try:
                              with open(filepath, "r", encoding="utf-8") as f:
                                  content = f.read()
                              
                              # Replace compileSdk/compileSdkVersion patterns with 36
                              content = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', content)
                              content = re.sub(r'compileSdkVersion\s*\(\s*\d+\s*\)', 'compileSdkVersion(36)', content)
                              content = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', content)
                              content = re.sub(r'compileSdkVersion\s+flutter\.compileSdkVersion', 'compileSdkVersion 36', content)
                              
                              with open(filepath, "w", encoding="utf-8") as f:
                                  f.write(content)
                          except Exception:
                              pass

          # 2. App-level build.gradle.kts configure karein
          app_kts = "flutter_app/android/app/build.gradle.kts"
          if os.path.exists(app_kts):
              with open(app_kts, "r") as f:
                  content = f.read()
              
              content = content.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              if "isCoreLibraryDesugaringEnabled" not in content:
                  if "compileOptions {" in content:
                      content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
                  else:
                      content = content.replace("android {", "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }")
              
              if "tasks-genai" not in content:
                  content += """
          dependencies {
              coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
              implementation("com.google.mediapipe:tasks-genai:0.10.14")
          }
          """
              with open(app_kts, "w") as f:
                  f.write(content)

          # 3. App-level build.gradle (Groovy fallback)
          app_groovy = "flutter_app/android/app/build.gradle"
          if os.path.exists(app_groovy):
              with open(app_groovy, "r") as f:
                  content = f.read()
              content = content.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              if "coreLibraryDesugaringEnabled" not in content:
                  if "compileOptions {" in content:
                      content = content.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
                  else:
                      content = content.replace("android {", "android {\n    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }")
              if "tasks-genai" not in content:
                  content += """
          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.4"
              implementation 'com.google.mediapipe:tasks-genai:0.10.14'
          }
          """
              with open(app_groovy, "w") as f:
                  f.write(content)
          EOF

      - name: Setup Keystore & Permissions
        working-directory: flutter_app/android
        run: |
          chmod +x gradlew || true
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keypass android \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            || true

      - name: Build Flutter Assets
        working-directory: flutter_app
        run: flutter build bundle

      - name: Build Pure Offline Release APK via Gradle
        working-directory: flutter_app/android
        run: ./gradlew assembleRelease -PtargetPlatform=android-arm64

      - name: Locate & Package APK
        working-directory: flutter_app
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK_FILE=$(find . -type f -name "*release*.apk" ! -name "*-unsigned.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find . -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build/app/outputs/flutter-apk/app-release.apk
          cp "$APK_FILE" build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} (Google MediaPipe GenAI) APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
