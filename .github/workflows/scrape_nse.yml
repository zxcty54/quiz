name: Scrape NSE Announcements

on:
  schedule:
    # Monday to Friday market hours (IST)
    - cron: '30 3,5,7,9,11 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pypdf pdfplumber

      - name: Run NSE Scraper Script
        run: |
          python nse_announcements_scraper.py

      - name: Commit and Push Announcements Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add nse_corporate_announcements.json

          if git diff --staged --quiet; then
            echo "ℹ️ Koi naya update nahi mila. Commit skipped."
          else
            git commit -m "📊 Auto-update NSE Announcements with PDF: $(date +'%d-%b-%Y %H:%M IST')"
            git pull --rebase origin main
            git push origin main
          fi
