name: "Build MockTester Offline Android APK"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components & NDK
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager \
            "platforms;android-36" \
            "platforms;android-35" \
            "platforms;android-34" \
            "build-tools;36.0.0" \
            "build-tools;34.0.0" \
            "ndk;25.2.9519653" \
            "cmake;3.22.1"

      - name: Clean & Force Android Scaffold
        working-directory: flutter_app
        run: |
          rm -rf android/app/src/main/java
          flutter create . --platforms=android --org com --project-name testing

      - name: Configure Global Gradle Properties
        working-directory: flutter_app/android
        run: |
          cat << 'EOF' >> gradle.properties
          android.useAndroidX=true
          android.enableJetifier=false
          android.suppressUnsupportedCompileSdk=36,Baklava
          android.experimental.disableCompileSdkChecks=true
          EOF

      - name: Inject Clean Flutter MainActivity.kt
        run: |
          mkdir -p flutter_app/android/app/src/main/kotlin/com/testing
          cat << 'EOF' > flutter_app/android/app/src/main/kotlin/com/testing/MainActivity.kt
          package com.testing

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
              // llama_cpp_dart handles FFI bindings directly
          }
          EOF

      - name: Setup Build Configuration, Permissions & Native SO Packaging
        working-directory: flutter_app
        run: |
          flutter pub get
          python3 - << 'EOF'
          import os

          # 1. Update android/app/build.gradle.kts (API 36 + Desugaring + Native SO Packaging)
          app_kts = "android/app/build.gradle.kts"
          if os.path.exists(app_kts):
              with open(app_kts, "r") as f:
                  content = f.read()
              
              content = content.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              content = content.replace("compileSdk = 34", "compileSdk = 36")
              
              if "isCoreLibraryDesugaringEnabled" not in content:
                  if "compileOptions {" in content:
                      content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
                  else:
                      content = content.replace("android {", "android {\n    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }")

              packaging_block = """
      packaging {
          resources {
              pickFirsts.add("**/libmtmd.so")
              pickFirsts.add("**/libllama.so")
              pickFirsts.add("**/libc++_shared.so")
          }
          jniLibs {
              useLegacyPackaging = true
          }
      }
  """
              if "packaging {" not in content:
                  content = content.replace("android {", "android {" + packaging_block)
              
              if "desugar_jdk_libs" not in content:
                  content += """
  dependencies {
      coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
  }
  """
              with open(app_kts, "w") as f:
                  f.write(content)

          # 2. Hook subprojects to compile with API 36 in settings.gradle.kts
          settings_kts = "android/settings.gradle.kts"
          if os.path.exists(settings_kts):
              with open(settings_kts, "a") as f:
                  f.write("""
  gradle.beforeProject {
      plugins.withId("com.android.library") {
          extensions.findByName("android")?.let { ext ->
              try {
                  ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
              } catch (_: Exception) {}
          }
      }
      plugins.withId("com.android.application") {
          extensions.findByName("android")?.let { ext ->
              try {
                  ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
              } catch (_: Exception) {}
          }
      }
  }
  """)

          # 3. Inject Full Storage Permissions & Flutter v2 Embedding into AndroidManifest.xml
          manifest_path = "android/app/src/main/AndroidManifest.xml"
          if os.path.exists(manifest_path):
              with open(manifest_path, "r") as f:
                  m_content = f.read()

              storage_permissions = """
      <uses-permission android:name="android.permission.INTERNET"/>
      <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE"/>
      <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE"/>
      <uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE"/>
      <uses-permission android:name="android.permission.READ_MEDIA_IMAGES"/>
      <uses-permission android:name="android.permission.READ_MEDIA_VIDEO"/>
      <uses-permission android:name="android.permission.READ_MEDIA_AUDIO"/>
  """
              if "MANAGE_EXTERNAL_STORAGE" not in m_content:
                  parts = m_content.split(">", 1)
                  m_content = parts[0] + ">" + storage_permissions + parts[1]

              if 'android:requestLegacyExternalStorage' not in m_content:
                  m_content = m_content.replace("<application", '<application android:requestLegacyExternalStorage="true" android:largeHeap="true"', 1)

              v2_tag = '\n        <meta-data android:name="flutterEmbedding" android:value="2" />\n'
              if 'android:name="flutterEmbedding"' not in m_content:
                  if "</application>" in m_content:
                      m_content = m_content.replace("</application>", f"{v2_tag}    </application>")

              with open(manifest_path, "w") as f:
                  f.write(m_content)
          print("Applied Storage Permissions, API 36, and SO packaging rules.")
          EOF

      - name: Setup Keystore & Permissions
        working-directory: flutter_app/android
        run: |
          chmod +x gradlew || true
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keypass android \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            || true

      - name: Build Pure Offline Release APK via Flutter
        working-directory: flutter_app
        run: flutter build apk --release --target-platform=android-arm64 --no-tree-shake-icons

      - name: Locate & Package APK
        working-directory: flutter_app
        run: |
          mkdir -p build/app/outputs/flutter-apk
          
          # Exact recursive search for release APK
          APK_FILE=$(find build/app/outputs -type f -name "*.apk" | grep -i "release" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          fi
          
          echo "Discovered APK Path: $APK_FILE"
          
          if [ -z "$APK_FILE" ]; then
            echo "ERROR: Release APK file build output me nahi mili!"
            exit 1
          fi

          TARGET_APK="build/app/outputs/flutter-apk/app-release.apk"
          BUILD_APK="build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk"
          TARGET_ZIP="build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip"

          cp "$APK_FILE" "$TARGET_APK"
          cp "$APK_FILE" "$BUILD_APK"
          
          # Direct zip compression
          zip -9 -j "$TARGET_ZIP" "$BUILD_APK"
          
          echo "Final Zip details:"
          ls -lh "$TARGET_ZIP"

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} (llama.cpp GGUF Core) APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
