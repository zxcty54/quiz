name: 3. Run Google Alerts Scraper

on:
  schedule:
    # 02:30 UTC = 08:00 AM IST (Daily)
    - cron: '30 2 * * *'
  workflow_dispatch: # GitHub Actions tab se manual run karne ke liye

concurrency:
  group: google-alerts-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-alerts:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout Code
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. Install Dependencies
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            curl_cffi \
            beautifulsoup4 \
            python-dateutil \
            requests \
            feedparser \
            lxml

      # 4. Run Script
      - name: Run Google Alerts Scraper Script
        run: |
          python alerts_scraper.py

      # 5. Commit and Push JSON
      - name: Commit and Push alerts_news.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add alerts_news.json

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit in alerts_news.json"
            exit 0
          fi

          git commit -m "Update Google Alerts News JSON [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "✅ alerts_news.json pushed successfully."
