name: 1. Run Web Scraper Only

on:
  workflow_dispatch: # GitHub Actions tab se manual run karne ke liye

jobs:
  scrape-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 python-dateutil urllib3 lxml requests feedparser

      - name: Run Scraper Script
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: python scraper.py

      - name: Commit and Push rawnews.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add rawnews.json
          git diff-index --quiet HEAD || git commit -m "Update rawnews.json [skip ci]"
          git pull --rebase origin main
          git push
