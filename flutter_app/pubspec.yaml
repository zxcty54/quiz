name: mocktester
description: "MockTester - Premier CBT Mock Test App"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  shimmer: ^3.0.0
  url_launcher: ^6.1.12
  fl_chart: ^0.68.0
  device_info_plus: ^10.1.0
  shared_preferences: ^2.2.2
  flutter_math_fork: ^0.7.2
  file_picker: ^6.1.1  # 👈 Added for attaching Image/PDF questions

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/data/
