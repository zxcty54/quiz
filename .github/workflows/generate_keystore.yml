name: Generate Permanent Keystore

on:
  workflow_dispatch:

jobs:
  create-keystore:
    name: Generate & Send Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Generate JKS Key via Keytool
        run: |
          keytool -genkey -v \
            -keystore mocktester_key.jks \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias mocktester \
            -storepass mocktester123 \
            -keypass mocktester123 \
            -dname "CN=MockTester, OU=App, O=MockTester, L=Patna, S=Bihar, C=IN"

      - name: Convert & Print Base64 to Console Log
        id: b64
        run: |
          B64_CONTENT=$(base64 -w 0 mocktester_key.jks)
          echo "BASE64_KEY=$B64_CONTENT" >> $GITHUB_ENV
          
          echo "==================== [COPY KEYSTORE_BASE64 BELOW] ===================="
          echo "$B64_CONTENT"
          echo "======================================================================"

      - name: Send Keystore File to Telegram
        run: |
          curl -F chat_id="${{ secrets.TELEGRAM_TO }}" \
               -F document=@mocktester_key.jks \
               -F caption="🔐 Save this permanent mocktester_key.jks safely on Google Drive!" \
               https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendDocument

      - name: Send Base64 String to Telegram
        run: |
          curl -s -X POST https://api.telegram.org/bot${{ secrets.TELEGRAM_TOKEN }}/sendMessage \
               -d chat_id="${{ secrets.TELEGRAM_TO }}" \
               -d text="📋 KEYSTORE_BASE64 (Copy this string to GitHub Secrets):%0A%0A${{ env.BASE64_KEY }}"
