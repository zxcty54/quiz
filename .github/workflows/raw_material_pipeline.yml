name: Sync Raw Material Margin & Import Matrix

on:
  schedule:
    # Tuesday aur Friday ko 6:00 PM IST (12:30 UTC) par run hoga
    - cron: '30 12 * * 2,5'
  workflow_dispatch:

jobs:
  run-matrix-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install requests

      - name: Scrape & Sync Raw Material Matrix
        env:
          GH_PAT_TOKEN: ${{ secrets.GH_PAT_TOKEN }}
        run: python raw_material_margin_pipeline.py
