name: Build MockTester Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Re-generate Native Android Project Files
        working-directory: flutter_app
        run: flutter create . --platforms=android

      - name: 📦 Get Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: 🎨 Generate App Icons
        working-directory: flutter_app
        run: dart run flutter_launcher_icons || true

      # 🛠️ Universal Auto-Patch compileSdk to 36 for App AND pub-cache Plugins (file_picker fix)
      - name: 🔧 Auto-Patch All Plugins & App compileSdk to 36
        run: |
          # 1. Patch flutter_app android files (Kotlin & Groovy)
          find flutter_app/android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          find flutter_app/android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' {} +
          find flutter_app/android/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk .*/compileSdk 36/g' {} +

          # 2. Patch downloaded plugins in pub-cache (Fixes :file_picker error)
          find ~/.pub-cache/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdkVersion.*/compileSdkVersion 36/g' {} +
          find ~/.pub-cache/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          find ~/.pub-cache/ -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -exec sed -i 's/compileSdk .*/compileSdk 36/g' {} +

      - name: 🛠️ Build APK (With Secrets Injected)
        working-directory: flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons \
            --dart-define=GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

      - name: 📤 Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      # 🚀 DIRECT TELEGRAM APK DELIVERY (Zip & Upload)
      - name: 📦 Compress APK for Telegram Delivery
        working-directory: flutter_app
        run: |
          zip -j build/app/outputs/flutter-apk/mocktester-apk.zip build/app/outputs/flutter-apk/app-release.apk

      - name: 📱 Send APK File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: "785009742"
          token: "1809778528:AAFlwdQMKgiezltaJYyAU5u6vNjblBiIPmo"
          message: "🚀 *MockTester APK Build Successful!*\n\nAPK file zip format me attached hai. Unzip karke install karein."
          document: flutter_app/build/app/outputs/flutter-apk/mocktester-apk.zip
