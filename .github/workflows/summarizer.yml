name: 2. Run AI Summarizer Only

on:
  workflow_dispatch: # GitHub Actions tab se manual run karne ke liye

jobs:
  summarize-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      - name: Run Summarizer Script
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python summarizer.py

      - name: Commit and Push Summary JSONs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # Generated finalnews.json and rawnews.json ko add karega
          git add finalnews.json rawnews.json
          git diff-index --quiet HEAD || git commit -m "Update AI Summary JSONs [skip ci]"
          git pull --rebase origin main
          git push
