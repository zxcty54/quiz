name: Run News Scraper

on:
  schedule:
    # Runs every 6 hours
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            curl_cffi \
            requests \
            urllib3 \
            beautifulsoup4 \
            feedparser \
            lxml

      - name: Execute Scraper Script
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
          PIB_ALERT_FEED_URL: ${{ secrets.PIB_ALERT_FEED_URL }}
        run: |
          python trial.py

      - name: Commit and push generated JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add trialoutput.json
          git status
          git diff --quiet && git diff --staged --quiet || (git commit -m "auto: update trialoutput.json [skip ci]" && git push)

      - name: Upload Output Artifact
        uses: actions/upload-artifact@v4
        with:
          name: trialoutput-json
          path: trialoutput.json
