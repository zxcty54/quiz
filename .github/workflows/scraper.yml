name: 1. Run Web Scraper Only

on:
  schedule:
    # Har 4 ghante par chalega (At minute 0 of UTC 00, 04, 08, 12, 16, 20)
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: news-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-news:
    runs-on: ubuntu-latest

    steps:
      # 1. CHECKOUT PRIVATE SCRAPER CODE
      - name: Checkout Scraper Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # 2. CHECKOUT TARGET PUBLIC REPO (content_base)
      - name: Checkout Public Content Base
        uses: actions/checkout@v4
        with:
          repository: 'zxcty54/content_base'
          token: ${{ secrets.GH_PAT_TOKEN }}
          path: 'content_base_repo'

      # 3. SETUP PYTHON
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 4. INSTALL DEPENDENCIES
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            curl_cffi \
            beautifulsoup4 \
            python-dateutil \
            urllib3 \
            lxml \
            requests \
            feedparser \
            googlenewsdecoder

      # 5. RUN SCRAPER
      - name: Run Scraper Script
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          # Agar content_base me pehle se rawnews.json maujood hai, to use base banane ke liye load karein
          if [ -f content_base_repo/rawnews.json ]; then
            cp content_base_repo/rawnews.json ./rawnews.json
            echo "✅ Existing rawnews.json loaded from content_base."
          fi

          python scraper.py

      # 6. CHECK & VALIDATE JSON
      - name: Check and Validate rawnews.json
        run: |
          if [ ! -f rawnews.json ]; then
            echo "❌ rawnews.json was not created."
            exit 1
          fi

          echo "========================================="
          echo "✅ rawnews.json exists"
          echo "========================================="
          du -h rawnews.json

          python - << 'PY'
          import json
          import sys

          try:
              with open("rawnews.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              print("✅ Valid JSON")
              national = data.get("national_raw_news", [])
              bihar = data.get("bihar_raw_news", [])

              print("🇮🇳 National records:", len(national))
              print("🏛️ Bihar records:", len(bihar))

              if len(national) == 0 and len(bihar) == 0:
                  print("\n❌ SCRAPER RETURNED ZERO NEWS")
                  sys.exit(2)

              all_items = national + bihar
              bad = 0
              for item in all_items:
                  title = str(item.get("title", "")).strip()
                  content = str(item.get("content", "")).strip()
                  url = str(item.get("url", "")).strip()
                  if not title or not url or not content or content == title:
                      bad += 1

              print(f"\n⚠️ Content validation warnings: {bad}")
              print("✅ JSON check completed.")

          except Exception as e:
              print(f"❌ JSON Reading Error: {e}")
              sys.exit(1)
          PY

      # 7. COMMIT AND PUSH TO content_base REPO
      - name: Commit and Push rawnews.json to content_base
        run: |
          echo "📋 Copying fresh rawnews.json into content_base folder..."
          cp rawnews.json content_base_repo/rawnews.json

          cd content_base_repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add rawnews.json

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit. rawnews.json is already up to date in content_base."
            exit 0
          fi

          git commit -m "Update rawnews.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "🚀 [SUCCESS] rawnews.json successfully attached and pushed to zxcty54/content_base!"
