name: Build MockTester Offline Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Clean & Force Android Scaffold
        working-directory: flutter_app
        run: |
          rm -rf android/app/src/main/java
          rm -rf android/app/src/main/kotlin
          flutter create . --platforms=android --org com.mocktester --project-name mocktester

      - name: Configure Global Gradle Properties
        working-directory: flutter_app/android
        run: |
          cat << 'EOF' >> gradle.properties
          android.useAndroidX=true
          android.enableJetifier=false
          android.suppressUnsupportedCompileSdk=36,Baklava
          android.experimental.disableCompileSdkChecks=true
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.vfs.watch=false
          EOF

      - name: Inject Clean Flutter MainActivity.kt
        run: |
          mkdir -p flutter_app/android/app/src/main/kotlin/com/mocktester/app
          cat << 'EOF' > flutter_app/android/app/src/main/kotlin/com/mocktester/app/MainActivity.kt
          package com.mocktester.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

      - name: Inject Valid AndroidManifest.xml
        run: |
          cat << 'EOF' > flutter_app/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mocktester.app">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>

              <application
                  android:label="MockTester"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="false"
                  android:hardwareAccelerated="true">

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Force CompileSdk 36 on All Plugins (Fix file_picker)
        working-directory: flutter_app
        run: |
          # Sabhi plugins aur libraries par compileSdk 36 enforce karne ke liye root build.gradle update
          cat << 'EOF' >> android/build.gradle

          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
              }
          }
          EOF

          # settings.gradle.kts ke liye bhi hook add karein agar project KTS use kar raha ho
          if [ -f "android/settings.gradle.kts" ]; then
            cat << 'EOF' >> android/settings.gradle.kts

            gradle.beforeProject {
                plugins.withId("com.android.library") {
                    extensions.findByName("android")?.let { ext ->
                        try {
                            ext.javaClass.getMethod("setCompileSdkVersion", Int::class.javaPrimitiveType).invoke(ext, 36)
                        } catch (_: Exception) {}
                    }
                }
            }
            EOF
          fi

      - name: Setup Build Configuration, Desugaring & MinSDK 26
        working-directory: flutter_app
        run: |
          flutter pub get

          APP_KTS="android/app/build.gradle.kts"
          APP_GROOVY="android/app/build.gradle"

          if [ -f "$APP_KTS" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$APP_KTS"
            sed -i 's/compileSdk = 34/compileSdk = 36/g' "$APP_KTS"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' "$APP_KTS"
            sed -i 's/minSdk = 24/minSdk = 26/g' "$APP_KTS"

            cat << 'EOF' >> "$APP_KTS"

            android {
                namespace = "com.mocktester.app"
                compileSdk = 36
                defaultConfig {
                    applicationId = "com.mocktester.app"
                    minSdk = 26
                    targetSdk = 34
                }
                compileOptions {
                    isCoreLibraryDesugaringEnabled = true
                }
            }

            dependencies {
                coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
            }
          EOF
          elif [ -f "$APP_GROOVY" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' "$APP_GROOVY"
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' "$APP_GROOVY"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/g' "$APP_GROOVY"
            sed -i 's/minSdkVersion 24/minSdkVersion 26/g' "$APP_GROOVY"

            cat << 'EOF' >> "$APP_GROOVY"

            android {
                namespace 'com.mocktester.app'
                compileSdkVersion 36
                defaultConfig {
                    applicationId "com.mocktester.app"
                    minSdkVersion 26
                    targetSdkVersion 34
                }
                compileOptions {
                    coreLibraryDesugaringEnabled true
                }
            }

            dependencies {
                coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
            }
          EOF
          fi

      - name: Build Pure Offline Release APK via Flutter
        working-directory: flutter_app
        run: |
          flutter build apk --release --target-platform=android-arm64 --no-tree-shake-icons

      - name: Locate & Package APK
        working-directory: flutter_app
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK_FILE=$(find build/app/outputs -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
