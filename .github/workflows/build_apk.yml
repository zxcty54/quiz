name: "Build MockTester Android APK"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. JDK 17
      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 3. Flutter Environment
      - name: Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      # 4. Android SDK Setup
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 5. Clean Environment & Install Required Tools
      - name: Cleanup NDKs & Install Build Tools
        run: |
          rm -rf /usr/local/lib/android/sdk/ndk/* || true
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools" "platforms;android-34" "build-tools;34.0.0"
          sdkmanager "cmake;3.18.1"
          sdkmanager "ndk;25.2.9519653"

      # 6. Re-generate Native Android Project
      - name: Re-generate Native Android Project Files
        working-directory: flutter_app
        run: flutter create . --platforms=android --org com --project-name testing

      # 7. Get Dependencies
      - name: Get Flutter Dependencies
        working-directory: flutter_app
        run: flutter pub get

      # 8. Clone llama.cpp & Universal Fix for Vulkan/SPIRV Conflict
      - name: Inject llama.cpp & Patch Native Engine
        run: |
          # Clone stable llama.cpp tag
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama_source

          # Inject in pub cache
          mkdir -p /home/runner/.pub-cache/hosted/pub.dev/llama.cpp
          cp -r /tmp/llama_source/* /home/runner/.pub-cache/hosted/pub.dev/llama.cpp/

          LLAMA_PKG_DIR=$(find /home/runner/.pub-cache/hosted/pub.dev/ -maxdepth 1 -name "flutter_llama-*" | head -n 1)
          if [ -d "$LLAMA_PKG_DIR" ]; then
            mkdir -p "$LLAMA_PKG_DIR/llama.cpp"
            cp -r /tmp/llama_source/* "$LLAMA_PKG_DIR/llama.cpp/"
          fi

          # Disable failing Vulkan/SPIRV backend and enforce fast ARM64 NEON CPU Engine
          find /home/runner/.pub-cache/ -type f -name "CMakeLists.txt" -exec sed -i 's/set(GGML_VULKAN ON)/set(GGML_VULKAN OFF)/gI' {} +
          find /home/runner/.pub-cache/ -type f -name "CMakeLists.txt" -exec sed -i 's/option(GGML_VULKAN ".*" ON)/option(GGML_VULKAN "" OFF)/gI' {} +
          find /home/runner/.pub-cache/ -type f -name "CMakeLists.txt" -exec sed -i 's/find_package(SPIRV-Headers REQUIRED)//g' {} +
          find /home/runner/.pub-cache/ -type f -name "CMakeLists.txt" -exec sed -i -E 's/cmake_policy\(SET CMP011[0-9].*\)//g' {} +
          find /home/runner/.pub-cache/ -type f -name "CMakeLists.txt" -exec sed -i -E 's/cmake_minimum_required\(VERSION [0-9]+\.[0-9]+(\.[0-9]+)?/cmake_minimum_required(VERSION 3.18.0/g' {} +

      # 9. SDK, NDK & Gradle Alignment
      - name: Configure CMake, NDK 25 & Android SDK Alignment
        run: |
          echo "cmake.dir=/usr/local/lib/android/sdk/cmake/3.18.1" >> flutter_app/android/local.properties
          echo "ndk.dir=/usr/local/lib/android/sdk/ndk/25.2.9519653" >> flutter_app/android/local.properties

          find flutter_app/android/ -type f -name "*.kts" -exec sed -i 's/applicationId = .*/applicationId = "com.testing"/g' {} +
          find flutter_app/android/ -type f -name "*.kts" -exec sed -i 's/namespace = .*/namespace = "com.testing"/g' {} +
          find flutter_app/android/ -type f -name "*.kts" -exec sed -i 's/minSdk = .*/minSdk = 24/g' {} +

          find flutter_app/android/ -type f -name "build.gradle" -exec sed -i 's/applicationId .*/applicationId "com.testing"/g' {} +
          find flutter_app/android/ -type f -name "build.gradle" -exec sed -i 's/namespace .*/namespace "com.testing"/g' {} +
          find flutter_app/android/ -type f -name "build.gradle" -exec sed -i 's/minSdkVersion .*/minSdkVersion 24/g' {} +

          mkdir -p ~/.gradle
          cat << 'EOF' > ~/.gradle/init.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.plugins.hasPlugin("com.android.application") || project.plugins.hasPlugin("com.android.library")) {
                      android {
                          ndkVersion = "25.2.9519653"
                      }
                  }
              }
          }
          EOF

      # 10. Keystore Setup
      - name: Setup Keystore & Permissions
        working-directory: flutter_app/android
        run: |
          chmod +x gradlew || true
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            || true

      # 11. Build Release APK
      - name: Build Release APK
        working-directory: flutter_app
        run: |
          export PATH="/usr/local/lib/android/sdk/cmake/3.18.1/bin:$PATH"
          flutter build apk \
            --release \
            --no-tree-shake-icons \
            --dart-define=GOOGLE_API_KEY=${{ secrets.GOOGLE_API_KEY }} \
            --dart-define=GROQ_API_KEY=${{ secrets.GROQ_API_KEY }}

      # 12. Upload Artifact
      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      # 13. Auto Rename & Zip
      - name: Auto-Rename APK & Compress
        working-directory: flutter_app
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      # 14. Send to Telegram
      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} (Offline LLM Native Engine Active) APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
