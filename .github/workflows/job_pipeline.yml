name: Auto Bihar & Central Jobs Pipeline

on:
  schedule:
    # Daily Subah 7:00 AM IST (1:30 AM UTC - News ke thoda baad run hoga)
    - cron: '30 1 * * *'
  workflow_dispatch: # GitHub UI me Manual Run ke liye

permissions:
  contents: write # Repository me Push & Write permissions allow karta hai

jobs:
  run-jobs-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 groq lxml

      - name: Run Job Scraper & AI Summarizer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python job_scraper.py

      - name: Auto-Commit and Push Updated Jobs JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # ✅ Sirf bihar_jobs.json ko track aur commit karega
          git add bihar_jobs.json
          git diff-index --quiet HEAD || git commit -m "Auto-update Bihar & Central Jobs JSON [skip ci]"
          git push
