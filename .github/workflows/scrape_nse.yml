name: NSE Daily Master Scraper

on:
  schedule:
    # Monday to Friday raat 8:00 PM IST (14:30 UTC)
    - cron: '30 14 * * 1-5'
  workflow_dispatch:

jobs:
  scrape-and-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi pypdf pdfplumber

      - name: Execute Daily Scraper
        run: |
          python nse_daily_master_scraper.py

      - name: Commit and Push Master Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add nse_corporate_master.json

          if git diff --staged --quiet; then
            echo "ℹ️ No fresh corporate filings to commit today."
          else
            git commit -m "📊 Auto-update NSE Corporate Master: $(date +'%d-%b-%Y')"
            git pull --rebase origin main
            git push origin main
          fi
