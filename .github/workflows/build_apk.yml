name: Build MockTester Offline Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'flutter_app/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Gradle Build Cache
        uses: gradle/actions/setup-gradle@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Clean & Force Android Scaffold
        working-directory: flutter_app
        run: |
          rm -rf android/app/src/main/java
          rm -rf android/app/src/main/kotlin
          flutter create . --platforms=android --org com.mocktester --project-name mocktester

      # 🛠️ FIX: Reliable Gradle Wrapper Injection with Gradle 9.3.1
      - name: Fix Gradle Wrapper Distribution URL
        working-directory: flutter_app/android
        run: |
          mkdir -p gradle/wrapper
          cat << 'EOF' > gradle/wrapper/gradle-wrapper.properties
          distributionBase=GRADLE_USER_HOME
          distributionPath=wrapper/dists
          zipStoreBase=GRADLE_USER_HOME
          zipStorePath=wrapper/dists
          distributionUrl=https\://services.gradle.org/distributions/gradle-9.3.1-all.zip
          EOF

      - name: Configure Global Gradle Properties
        working-directory: flutter_app/android
        run: |
          cat << 'EOF' >> gradle.properties
          android.useAndroidX=true
          android.enableJetifier=false
          android.suppressUnsupportedCompileSdk=36,Baklava
          android.experimental.disableCompileSdkChecks=true
          org.gradle.jvmargs=-Xmx3072m -XX:MaxMetaspaceSize=768m
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.vfs.watch=false
          EOF

      - name: Inject Clean Flutter MainActivity.kt
        run: |
          mkdir -p flutter_app/android/app/src/main/kotlin/com/mocktester/app
          cat << 'EOF' > flutter_app/android/app/src/main/kotlin/com/mocktester/app/MainActivity.kt
          package com.mocktester.app

          import io.flutter.embedding.android.FlutterActivity

          class MainActivity: FlutterActivity() {
          }
          EOF

      - name: Inject Valid AndroidManifest.xml
        run: |
          cat << 'EOF' > flutter_app/android/app/src/main/AndroidManifest.xml
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.mocktester.app">

              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
              <uses-permission android:name="android.permission.VIBRATE"/>

              <application
                  android:label="MockTester"
                  android:name="${applicationName}"
                  android:icon="@mipmap/ic_launcher"
                  android:usesCleartextTraffic="true"
                  android:hardwareAccelerated="true">

                  <meta-data
                      android:name="flutterEmbedding"
                      android:value="2" />

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:taskAffinity=""
                      android:theme="@style/LaunchTheme"
                      android:configChanges="orientation|keyboardHidden|keyboard|screenSize|smallestScreenSize|locale|layoutDirection|fontScale|screenLayout|density|uiMode"
                      android:hardwareAccelerated="true"
                      android:windowSoftInputMode="adjustResize">

                      <meta-data
                          android:name="io.flutter.embedding.android.NormalTheme"
                          android:resource="@style/NormalTheme" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

      - name: Force CompileSdk 36 on All Plugins (Fix file_picker & webview)
        working-directory: flutter_app
        run: |
          SETTINGS_KTS="android/settings.gradle.kts"
          SETTINGS_GROOVY="android/settings.gradle"

          if [ -f "$SETTINGS_KTS" ]; then
            printf "\n\ngradle.beforeProject {\n    plugins.withId(\"com.android.library\") {\n        extensions.findByName(\"android\")?.let { ext ->\n            try {\n                ext.javaClass.getMethod(\"setCompileSdkVersion\", Int::class.javaPrimitiveType).invoke(ext, 36)\n            } catch (_: Exception) {}\n        }\n    }\n}\n" >> "$SETTINGS_KTS"
          fi

          if [ -f "$SETTINGS_GROOVY" ]; then
            printf "\n\ngradle.beforeProject { project ->\n    project.plugins.withId('com.android.library') { plugin ->\n        project.android.compileSdkVersion = 36\n    }\n}\n" >> "$SETTINGS_GROOVY"
          fi

          ROOT_BUILD="android/build.gradle"
          if [ -f "$ROOT_BUILD" ]; then
            printf "\n\nsubprojects {\n    afterEvaluate { project ->\n        if (project.hasProperty('android')) {\n            project.android {\n                compileSdkVersion 36\n            }\n        }\n    }\n}\n" >> "$ROOT_BUILD"
          fi

      - name: Setup Build Configuration, Desugaring & Permanent Signing
        working-directory: flutter_app
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          python3 -c "import base64, os; data = os.environ.get('KEYSTORE_BASE64', '').strip(); open('android/app/mocktester_key.jks', 'wb').write(base64.b64decode(data))"

          APP_KTS="android/app/build.gradle.kts"
          APP_GROOVY="android/app/build.gradle"

          if [ -f "$APP_KTS" ]; then
            sed -i 's/compileSdk = flutter.compileSdkVersion/compileSdk = 36/g' "$APP_KTS"
            sed -i 's/compileSdk = 34/compileSdk = 36/g' "$APP_KTS"
            sed -i 's/minSdk = flutter.minSdkVersion/minSdk = 26/g' "$APP_KTS"
            sed -i 's/minSdk = 24/minSdk = 26/g' "$APP_KTS"

            cat << 'EOF' >> "$APP_KTS"

            android {
                namespace = "com.mocktester.app"
                compileSdk = 36
                defaultConfig {
                    applicationId = "com.mocktester.app"
                    minSdk = 26
                    targetSdk = 34
                }
                signingConfigs {
                    create("release") {
                        storeFile = file("mocktester_key.jks")
                        storePassword = System.getenv("KEYSTORE_PASSWORD") ?: "mocktester123"
                        keyAlias = System.getenv("KEY_ALIAS") ?: "mocktester"
                        keyPassword = System.getenv("KEY_PASSWORD") ?: "mocktester123"
                    }
                }
                buildTypes {
                    getByName("release") {
                        signingConfig = signingConfigs.getByName("release")
                        isMinifyEnabled = false
                        isShrinkResources = false
                    }
                }
                compileOptions {
                    isCoreLibraryDesugaringEnabled = true
                }
            }

            dependencies {
                coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")
            }
          EOF
          elif [ -f "$APP_GROOVY" ]; then
            sed -i 's/compileSdkVersion flutter.compileSdkVersion/compileSdkVersion 36/g' "$APP_GROOVY"
            sed -i 's/compileSdkVersion 34/compileSdkVersion 36/g' "$APP_GROOVY"
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 26/g' "$APP_GROOVY"
            sed -i 's/minSdkVersion 24/minSdkVersion 26/g' "$APP_GROOVY"

            cat << 'EOF' >> "$APP_GROOVY"

            android {
                namespace 'com.mocktester.app'
                compileSdkVersion 36
                defaultConfig {
                    applicationId "com.mocktester.app"
                    minSdkVersion 26
                    targetSdkVersion 34
                }
                signingConfigs {
                    release {
                        storeFile file("mocktester_key.jks")
                        storePassword System.getenv("KEYSTORE_PASSWORD") ?: "mocktester123"
                        keyAlias System.getenv("KEY_ALIAS") ?: "mocktester"
                        keyPassword System.getenv("KEY_PASSWORD") ?: "mocktester123"
                    }
                }
                buildTypes {
                    release {
                        signingConfig signingConfigs.release
                        minifyEnabled false
                        shrinkResources false
                    }
                }
                compileOptions {
                    coreLibraryDesugaringEnabled true
                }
            }

            dependencies {
                coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
            }
          EOF
          fi

      - name: Build Pure Offline Release APK via Flutter
        working-directory: flutter_app
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          flutter clean
          flutter pub get

          # 🛠️ AGP 9.0+ Proguard auto-patch: replaces deprecated proguard-android.txt with proguard-android-optimize.txt
          TARGET_FILES=$(find /home/runner/.pub-cache -name "build.gradle" -path "*/flutter_inappwebview_android*/*")
          for f in $TARGET_FILES; do
            echo "Patching: $f"
            sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" "$f"
          done

          # 🛠️ --no-pub flag ensures Flutter doesn't revert the patch during build
          flutter build apk --release --no-pub --target-platform=android-arm64 --no-tree-shake-icons --build-number=${{ github.run_number }}

      - name: Locate & Package APK
        working-directory: flutter_app
        run: |
          mkdir -p build/app/outputs/flutter-apk
          APK_FILE=$(find build/app/outputs -type f -name "*release*.apk" | head -n 1)
          if [ -z "$APK_FILE" ]; then
            APK_FILE=$(find build/app/outputs -type f -name "*.apk" | head -n 1)
          fi
          echo "Found APK at: $APK_FILE"
          cp "$APK_FILE" build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
