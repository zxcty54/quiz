Name: Build MockTester Android APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 📁 Checkout Repository Code
        uses: actions/checkout@v4

      - name: ☕ Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: ⚡ Setup Flutter Environment
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: 🛠️ Re-generate Native Android Project Files
        working-directory: quiz/flutter_app
        run: flutter create . --platforms=android

      - name: 📦 Get Flutter Dependencies
        working-directory: quiz/flutter_app
        run: flutter pub get

      # 🎨 Launcher Icon Generate Step
      - name: 🎨 Generate App Icons
        working-directory: quiz/flutter_app
        run: dart run flutter_launcher_icons || true

      - name: 🛠️ Build APK
        working-directory: quiz/flutter_app
        run: flutter build apk --release --no-tree-shake-icons

      - name: 📤 Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: quiz/flutter_app/build/app/outputs/flutter-apk/app-release.apk

      # 🚀 DIRECT TELEGRAM DELIVERY
      - name: 📱 Send APK File Direct To Telegram
        run: |
          curl -F chat_id="785009742" \
               -F document=@"quiz/flutter_app/build/app/outputs/flutter-apk/app-release.apk" \
               -F caption="🚀 *MockTester APK Build Successful!*%0A%0AMobile me 1-tap me install karein." \
               -F parse_mode="Markdown" \
               https://api.telegram.org/bot1809778528:AAFlwdQMKgiezltaJYyAU5u6vNjblBiIPmo/sendDocument
