Name: 4. Run Google Alerts Summarizer Only

on:
  schedule:
    # Runs every 4.5 hours (Intervals: 00:00, 04:30, 09:00, 13:30, 18:00, 22:30 UTC)
    - cron: '0 0,9,18 * * *'
    - cron: '30 4,13,22 * * *'
  workflow_dispatch: # Manual trigger for testing

concurrency:
  group: alerts-summarizer
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  summarize-alerts:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. CHECKOUT CODE
      # =====================================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # =====================================================
      # 2. SETUP PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =====================================================
      # 3. INSTALL DEPENDENCIES
      # =====================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install groq requests

      # =====================================================
      # 4. RUN ALERTS SUMMARIZER SCRIPT
      # =====================================================
      - name: Run Alerts Summarizer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          python alerts_summarizer.py

      # =====================================================
      # 5. COMMIT & PUSH BOTH JSON FILES (Website + App)
      # =====================================================
      - name: Commit and Push Summary JSONs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          # Website Master File + App Rolling 3-Day File
          git add final_alerts_news.json app_alerts_news.json

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit in JSON files"
            exit 0
          fi

          git commit -m "Update Final Google Alerts Summary JSONs [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "✅ JSON files pushed successfully."
