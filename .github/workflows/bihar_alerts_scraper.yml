name: Run Bihar Alerts Scraper

on:
  schedule:
    # Har 4 ghante par automatic run hoga
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: bihar-alerts-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-append-bihar:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests lxml

      - name: Run Bihar Scraper Script
        run: |
          python bihar_alerts_scraper.py

      - name: Commit & Push rawnews.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add rawnews.json

          if git diff --cached --quiet; then
            echo "ℹ️ No new changes to commit in rawnews.json"
            exit 0
          fi

          git commit -m "Append Bihar Google Alerts to rawnews.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "✅ rawnews.json successfully updated and pushed."
