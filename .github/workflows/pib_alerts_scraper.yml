name: 5. Run PIB Google Alerts Scraper

on:
  schedule:
    # Har 4 ghante par automatic chalega
    - cron: '0 */4 * * *'
  workflow_dispatch: # GitHub Actions tab se manual run karne ke liye

concurrency:
  group: pib-alerts-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-pib-alerts:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. CHECKOUT CODE
      # =====================================================
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # =====================================================
      # 2. SETUP PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =====================================================
      # 3. INSTALL ALL DEPENDENCIES
      # =====================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            feedparser \
            beautifulsoup4 \
            requests \
            lxml \
            python-dateutil \
            curl_cffi

      # =====================================================
      # 4. RUN SCRAPER SCRIPT
      # =====================================================
      - name: Run PIB Alerts Scraper Script
        env:
          PIB_ALERT_FEED_URL: "https://www.google.com/alerts/feeds/18398184577640792063/4294037665781559395"
        run: |
          python pib_alerts_scraper.py

      # =====================================================
      # 5. COMMIT & PUSH RAWNEWS.JSON
      # =====================================================
      - name: Commit and Push rawnews.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add rawnews.json

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit in rawnews.json"
            exit 0
          fi

          git commit -m "Update PIB Google Alerts Raw JSON in rawnews.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "✅ rawnews.json pushed successfully."
