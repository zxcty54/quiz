name: 2. Run AI Summarizer Only

on:
  schedule:
    # Har 4 ghante par automatic chalega (At minute 0 of UTC 00, 04, 08, 12, 16, 20)
    - cron: '0 */4 * * *'
  workflow_dispatch: # GitHub Actions tab se manual run karne ke liye

jobs:
  summarize-news:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai requests

      - name: Run Summarizer Script
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python summarizer.py

      - name: Commit and Push Summary JSONs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          # Daily finalnews, rawnews, aur Master Archive all_current_affairs push hoga
          git add finalnews.json rawnews.json all_current_affairs.json

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit"
            exit 0
          fi

          git commit -m "Update Daily and Master Archive News JSONs [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
