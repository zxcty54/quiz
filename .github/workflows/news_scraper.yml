name: Auto Bihar News Summarizer

on:
  schedule:
    # Daily Subah 6:30 AM IST (1:00 AM UTC) par chalega
    - cron: '0 1 * * *'
  workflow_dispatch: # GitHub Actions UI me "Run workflow" button ke liye

jobs:
  run-news-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 google-genai

      - name: Run Scraper & AI Summarizer
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: python main.py

      - name: Auto-Commit and Push Updated JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add bihar_news.json
          git diff-index --quiet HEAD || git commit -m "Auto-update Bihar News JSON [skip ci]"
          git push
