name: Auto Monthly Current Affairs MCQ Generator

on:
  schedule:
    # Daily raat 11:45 PM IST (18:15 UTC) par execute hoga
    - cron: '15 18 * * *'
  workflow_dispatch:

jobs:
  generate-mcqs:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # =====================================================
      # 1. CHECKOUT PRIVATE CODE
      # =====================================================
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # 2. CHECKOUT TARGET PUBLIC REPO (content_base)
      # =====================================================
      - name: Checkout Public Content Base
        uses: actions/checkout@v4
        with:
          repository: 'zxcty54/content_base'
          token: ${{ secrets.GH_PAT_TOKEN }}
          path: 'content_base_repo'

      # =====================================================
      # 3. SETUP PYTHON
      # =====================================================
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # =====================================================
      # 4. INSTALL DEPENDENCIES
      # =====================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-genai groq requests

      # =====================================================
      # 5. RUN MONTHLY MCQ GENERATOR
      # =====================================================
      - name: Run Monthly MCQ Generator
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          echo "📥 Syncing inputs from content_base..."
          # Agar script ko previous raw ya final files ki need hoti hai:
          if [ -f content_base_repo/finalnews.json ]; then
            cp content_base_repo/finalnews.json ./finalnews.json
          fi
          if [ -f content_base_repo/all_current_affairs.json ]; then
            cp content_base_repo/all_current_affairs.json ./all_current_affairs.json
          fi

          # Agar current_affair folder pehle se content_base me exist karta hai to copy karein
          if [ -d content_base_repo/current_affair ]; then
            mkdir -p current_affair
            cp -r content_base_repo/current_affair/* ./current_affair/ 2>/dev/null || true
          fi

          python generate_monthly_mcq.py

          echo "📋 Copying generated MCQs into content_base folder..."
          mkdir -p content_base_repo/current_affair
          if [ -d current_affair ]; then
            cp -r current_affair/* content_base_repo/current_affair/ 2>/dev/null || true
          fi

      # =====================================================
      # 6. COMMIT AND PUSH TO content_base REPO
      # =====================================================
      - name: Commit and Push Updated Quiz Files to content_base
        run: |
          cd content_base_repo
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add current_affair/*.json

          if git diff --staged --quiet; then
            echo "ℹ️ Koi naya MCQ add nahi hua, commit skip kiya."
            exit 0
          fi

          git commit -m "🤖 Auto-update Current Affairs MCQs: $(date +'%d-%b-%Y') [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "🚀 [SUCCESS] Current Affairs MCQs successfully updated and pushed to zxcty54/content_base!"
