name: Auto Bihar & Central Jobs Pipeline

on:
  schedule:
    - cron: '30 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-jobs-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi beautifulsoup4 groq lxml PyMuPDF playwright
          playwright install chromium --with-deps

      - name: Run Main Job Scraper
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python job_scraper.py

      # 🧪 Playwright-powered SarkariResult Test
      - name: Run SarkariResult Test
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python test_sarkari.py

      - name: Auto-Commit and Push Updated Jobs JSON
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          git add bihar_jobs.json
          
          git pull origin main --rebase || true
          git diff-index --quiet HEAD || git commit -m "Auto-update Bihar & Central Jobs JSON [skip ci]"
          git push origin main
