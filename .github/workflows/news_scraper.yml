name: Auto Bihar & National News + Jobs Pipeline

on:
  schedule:
    # Daily Subah 6:30 AM IST (1:00 AM UTC)
    - cron: '0 1 * * *'
  workflow_dispatch: # GitHub UI me Manual Run ke liye

permissions:
  contents: write # Repository me Push & Write permissions allow karta hai

jobs:
  run-news-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi beautifulsoup4 groq lxml

      - name: Run News Scraper & AI Summarizer
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python main.py

      - name: Run Bihar Jobs Scraper (If job_scraper.py exists)
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: |
          if [ -f job_scraper.py ]; then
            python job_scraper.py
          else
            echo "job_scraper.py not found, skipping job scraping step."
          fi

      - name: Auto-Commit and Push Updated JSONs
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"
          # ✅ Tracks all generated JSON files (bihar_news.json, national_news.json, bihar_jobs.json, history)
          git add -A
          git diff-index --quiet HEAD || git commit -m "Auto-update News & Jobs JSONs [skip ci]"
          git push
