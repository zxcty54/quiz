name: "Build MockTester Offline Android APK"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Re-generate Native Android Project Files
        working-directory: flutter_app
        run: flutter create . --platforms=android --org com --project-name testing

      - name: Get Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Inject Missing llama.cpp Submodule into Package Cache
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama_source
          LLAMA_DART_PKG=$(find /home/runner/.pub-cache/hosted/pub.dev/ -maxdepth 1 -name "llama_cpp_dart-*" | head -n 1)
          if [ -d "$LLAMA_DART_PKG" ]; then
            echo "Found llama_cpp_dart at: $LLAMA_DART_PKG"
            mkdir -p "$LLAMA_DART_PKG/src/llama.cpp"
            cp -r /tmp/llama_source/* "$LLAMA_DART_PKG/src/llama.cpp/"
            mkdir -p "$LLAMA_DART_PKG/llama.cpp"
            cp -r /tmp/llama_source/* "$LLAMA_DART_PKG/llama.cpp/"
          fi

      - name: Configure Android SDK 36, App ID & Desugaring
        run: |
          # 1. Update SDK Versions (compileSdk 36, targetSdk 36, minSdk 24)
          find flutter_app/android/ -type f -name "*.kts" -exec sed -i 's/compileSdk = .*/compileSdk = 36/g' {} +
          find flutter_app/android/ -type f -name "*.kts" -exec sed -i 's/targetSdk = .*/targetSdk = 36/g' {} +
          find flutter_app/android/ -type f -name "*.kts" -exec sed -i 's/minSdk = .*/minSdk = 24/g' {} +
          find flutter_app/android/ -type f -name "*.kts" -exec sed -i 's/applicationId = .*/applicationId = "com.testing"/g' {} +
          find flutter_app/android/ -type f -name "*.kts" -exec sed -i 's/namespace = .*/namespace = "com.testing"/g' {} +

          find flutter_app/android/ -type f -name "build.gradle" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/g' {} +
          find flutter_app/android/ -type f -name "build.gradle" -exec sed -i 's/targetSdkVersion .*/targetSdkVersion 36/g' {} +
          find flutter_app/android/ -type f -name "build.gradle" -exec sed -i 's/minSdkVersion .*/minSdkVersion 24/g' {} +
          find flutter_app/android/ -type f -name "build.gradle" -exec sed -i 's/applicationId .*/applicationId "com.testing"/g' {} +
          find flutter_app/android/ -type f -name "build.gradle" -exec sed -i 's/namespace .*/namespace "com.testing"/g' {} +

          # 2. Inject Desugaring for flutter_local_notifications in build.gradle.kts
          if [ -f "flutter_app/android/app/build.gradle.kts" ]; then
            sed -i '/compileOptions {/a \        isCoreLibraryDesugaringEnabled = true' flutter_app/android/app/build.gradle.kts
            sed -i '/dependencies {/a \    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")' flutter_app/android/app/build.gradle.kts
          fi

          # 3. Inject Desugaring in Groovy build.gradle fallback
          if [ -f "flutter_app/android/app/build.gradle" ]; then
            sed -i '/compileOptions {/a \        coreLibraryDesugaringEnabled true' flutter_app/android/app/build.gradle
            sed -i '/dependencies {/a \    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"' flutter_app/android/app/build.gradle
          fi

      - name: Setup Keystore & Permissions
        working-directory: flutter_app/android
        run: |
          chmod +x gradlew || true
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            || true

      - name: Build Pure Offline Release APK
        working-directory: flutter_app
        run: |
          flutter build apk --release --no-tree-shake-icons

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Auto-Rename APK & Compress
        working-directory: flutter_app
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} (SDK 36 + Desugared) APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
