name: 1. Run Web Scraper Only

on:
  schedule:
    # 01:30 UTC = 07:00 AM IST (Daily)
    - cron: '30 1 * * *'
  workflow_dispatch:

concurrency:
  group: news-scraper
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-news:
    runs-on: ubuntu-latest

    steps:
      # 1. CHECKOUT
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # 2. SETUP PYTHON
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # 3. INSTALL DEPENDENCIES
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install \
            curl_cffi \
            beautifulsoup4 \
            python-dateutil \
            urllib3 \
            lxml \
            requests \
            feedparser \
            googlenewsdecoder

      # 4. RUN SCRAPER
      - name: Run Scraper Script
        env:
          SCRAPINGANT_API_KEY: ${{ secrets.SCRAPINGANT_API_KEY }}
        run: |
          python scraper.py

      # 5. CHECK JSON
      - name: Check rawnews.json
        run: |
          if [ ! -f rawnews.json ]; then
            echo "❌ rawnews.json was not created."
            exit 1
          fi

          echo "========================================="
          echo "✅ rawnews.json exists"
          echo "========================================="

          echo ""
          echo "📦 File size:"
          du -h rawnews.json

          echo ""
          echo "🔎 JSON validation:"

          python - << 'PY'
          import json
          import sys

          try:
              with open("rawnews.json", "r", encoding="utf-8") as f:
                  data = json.load(f)

              print("✅ Valid JSON")
              print("🇮🇳 National:", data.get("national_raw_count", 0))
              print("🏛️ Bihar:", data.get("bihar_raw_count", 0))

              national = data.get("national_raw_news", [])
              bihar = data.get("bihar_raw_news", [])

              print("\nNational records:", len(national))
              print("Bihar records:", len(bihar))

              if len(national) == 0 and len(bihar) == 0:
                  print("\n❌ SCRAPER RETURNED ZERO NEWS")
                  print("❌ Existing rawnews.json will NOT be committed.")
                  sys.exit(2)

              all_items = national + bihar
              bad = 0

              for i, item in enumerate(all_items, 1):
                  title = str(item.get("title", "")).strip()
                  content = str(item.get("content", "")).strip()
                  url = str(item.get("url", "")).strip()

                  if not title or not url or not content or content == title:
                      bad += 1

              print(f"\n⚠️ Content validation warnings: {bad}")
              print("✅ JSON check completed.")

          except Exception as e:
              print(f"❌ JSON Reading Error: {e}")
              sys.exit(1)
          PY

      # 6. SAVE GENERATED JSON TEMPORARILY
      - name: Protect Generated JSON
        run: |
          cp rawnews.json /tmp/rawnews.generated.json
          echo "✅ Generated rawnews.json backed up."

      # 7. SYNC WITH LATEST MAIN
      - name: Sync With Latest Main
        run: |
          echo "🔄 Fetching latest main..."
          git fetch origin main
          echo "🔄 Resetting working tree to latest main..."
          git reset --hard origin/main
          echo "✅ Repository synchronized with latest main."

      # 8. RESTORE SCRAPED JSON
      - name: Restore Generated JSON
        run: |
          cp /tmp/rawnews.generated.json rawnews.json
          echo "✅ New scraped rawnews.json restored."

      # 9. CHECK DIFF
      - name: Check Changes
        run: |
          echo "========================================="
          echo "📊 Git changes"
          echo "========================================="
          git status --short

          if git diff --quiet -- rawnews.json; then
            echo "ℹ️ rawnews.json has no changes."
          else
            echo "📝 rawnews.json has changed."
          fi

      # 10. COMMIT AND PUSH
      - name: Commit and Push rawnews.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add rawnews.json

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit."
            exit 0
          fi

          git commit -m "Update rawnews.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "✅ rawnews.json pushed successfully."
