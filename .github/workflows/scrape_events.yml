name: Scrape Bihar Tourism Events

on:
  schedule:
    - cron: '30 0 * * *'
  workflow_dispatch:

jobs:
  scrape-bihar-events:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # cache: 'pip' hata diya gaya hai

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 urllib3

      - name: Run Bihar Tourism Scraper
        run: |
          python bihar_events_scraper.py

      - name: Commit and Push Events JSON
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add bihar_events_2026_2027.json
          
          if git diff --staged --quiet; then
            echo "Koi naya event update nahi mila. Commit skipped."
          else
            git commit -m "📅 Auto-update Bihar Tourism Events: $(date +'%d-%b-%Y')"
            git pull --rebase origin main
            git push origin main
          fi
