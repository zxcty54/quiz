name: Run Bihar Alerts Scraper

on:
  schedule:
    # Har 4 ghante par automatic run hoga
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: bihar-alerts-pipeline
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scrape-and-append-bihar:
    runs-on: ubuntu-latest

    steps:
      # =====================================================
      # 1. CHECKOUT PRIVATE CODE
      # =====================================================
      - name: Checkout Code from Private Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: main

      # =====================================================
      # 2. CHECKOUT TARGET PUBLIC REPO (content_base)
      # =====================================================
      - name: Checkout Public Content Base
        uses: actions/checkout@v4
        with:
          repository: 'zxcty54/content_base'
          token: ${{ secrets.GH_PAT_TOKEN }}
          path: 'content_base_repo'

      # =====================================================
      # 3. SETUP PYTHON
      # =====================================================
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # =====================================================
      # 4. INSTALL DEPENDENCIES
      # =====================================================
      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install feedparser beautifulsoup4 requests lxml

      # =====================================================
      # 5. RUN BIHAR SCRAPER SCRIPT
      # =====================================================
      - name: Run Bihar Scraper Script
        run: |
          echo "📥 Checking existing rawnews.json from content_base..."
          if [ -f content_base_repo/rawnews.json ]; then
            cp content_base_repo/rawnews.json ./rawnews.json
            echo "✅ Existing rawnews.json loaded from content_base."
          fi

          python bihar_alerts_scraper.py

          echo "📋 Copying appended rawnews.json to content_base folder..."
          cp rawnews.json content_base_repo/rawnews.json

      # =====================================================
      # 6. COMMIT & PUSH TO content_base REPO
      # =====================================================
      - name: Commit and Push rawnews.json to content_base
        run: |
          cd content_base_repo
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action Bot"

          git add rawnews.json

          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit. rawnews.json is already up to date in content_base."
            exit 0
          fi

          git commit -m "Append Bihar Google Alerts to rawnews.json [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main

          echo "🚀 [SUCCESS] rawnews.json successfully updated and pushed to zxcty54/content_base!"
