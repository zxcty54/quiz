name: Build MockTester Signed Android APK

on:
  push:
    branches:
      - arena/203fc61a-quiz
    paths:
      - "flutter_app/**"
      - ".github/workflows/build_apk.yml"
  workflow_dispatch:
    inputs:
      version_code:
        description: "Optional positive Android versionCode (defaults to the workflow run number)"
        required: false
        type: string
        default: ""
      send_to_telegram:
        description: "Send the signed APK archive to the configured Telegram chat"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  build:
    name: Build signed Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v3

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Validate release inputs and upload-key secrets
        id: release
        env:
          VERSION_CODE_INPUT: ${{ inputs.version_code }}
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD SUPABASE_URL SUPABASE_ANON_KEY; do
            if [ -z "${!name}" ]; then
              echo "::error title=Missing release setting::$name is required; no debug-signed release is permitted."
              exit 1
            fi
          done

          VERSION_CODE="$VERSION_CODE_INPUT"
          if [ -z "$VERSION_CODE" ]; then VERSION_CODE="$GITHUB_RUN_NUMBER"; fi
          if ! [[ "$VERSION_CODE" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error title=Invalid versionCode::Use a positive integer."
            exit 1
          fi
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"

          mkdir -p "$RUNNER_TEMP/play-release"
          export KEYSTORE_PATH="$RUNNER_TEMP/play-release/upload-key.jks"
          python3 - <<'PY'
          import base64, os, pathlib, sys
          encoded = os.environ.get('KEYSTORE_BASE64', '').strip()
          try:
              data = base64.b64decode(encoded, validate=True)
          except Exception as exc:
              print(f'::error title=Invalid upload keystore::{exc}')
              sys.exit(1)
          if not data:
              print('::error title=Empty upload keystore::KEYSTORE_BASE64 decoded to an empty file.')
              sys.exit(1)
          pathlib.Path(os.environ['KEYSTORE_PATH']).write_bytes(data)
          PY
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Stage optional Firebase configuration
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "No Firebase descriptor secret supplied; FCM will remain disabled."
            exit 0
          fi
          printf '%s' "$GOOGLE_SERVICES_JSON_BASE64" | base64 --decode > "$RUNNER_TEMP/google-services.json"
          python3 - <<'PY'
          import json, os, pathlib, sys
          path = pathlib.Path(os.environ['RUNNER_TEMP']) / 'google-services.json'
          try:
              data = json.loads(path.read_text())
              packages = [
                  client.get('client_info', {}).get('android_client_info', {}).get('package_name')
                  for client in data.get('client', [])
              ]
          except Exception as exc:
              print(f'::error title=Invalid Firebase configuration::{exc}')
              sys.exit(1)
          if 'com.mocktester.app' not in packages:
              print('::error title=Wrong Firebase application ID::The supplied descriptor must contain a client for com.mocktester.app.')
              sys.exit(1)
          PY

      - name: Generate fresh Android scaffold and apply release overlay
        working-directory: flutter_app
        run: |
          set -euo pipefail
          saved_google_services="$RUNNER_TEMP/google-services.json"
          if [ ! -f "$saved_google_services" ] && [ -f android/app/google-services.json ]; then
            cp android/app/google-services.json "$saved_google_services"
          fi
          rm -rf android
          flutter create . --platforms=android --org com.mocktester --project-name mocktester
          # `flutter create` adds a stock Counter widget test when this app has no tests.
          # That generated test calls MyApp() without its required onboarding state.
          if [ -f test/widget_test.dart ] \
            && ! git -C .. ls-files --error-unmatch flutter_app/test/widget_test.dart >/dev/null 2>&1; then
            rm -f test/widget_test.dart
            rmdir test 2>/dev/null || true
          fi
          rm -rf android/app/src/main/java android/app/src/main/kotlin
          if [ -f "$saved_google_services" ]; then
            cp "$saved_google_services" android/app/google-services.json
          fi
          cp -R android_overlay/app/. android/app/

      - name: Declare Google Services Gradle plugin
        working-directory: flutter_app/android
        run: |
          python3 - <<'PY'
          import pathlib, sys
          path = pathlib.Path('settings.gradle.kts')
          if not path.exists():
              print('::error title=Unexpected Android scaffold::settings.gradle.kts was not generated.')
              sys.exit(1)
          lines = path.read_text().splitlines()
          if not any('com.google.gms.google-services' in line for line in lines):
              plugin_index = next(
                  (i for i, line in enumerate(lines)
                   if 'id("org.jetbrains.kotlin.android")' in line
                   or 'id("kotlin-android")' in line),
                  None,
              )
              if plugin_index is None:
                  print('::error title=Firebase Gradle configuration::Could not locate the Kotlin plugin declaration.')
                  sys.exit(1)
              lines.insert(
                  plugin_index + 1,
                  '    id("com.google.gms.google-services") version "4.4.2" apply false',
              )
              path.write_text('\n'.join(lines) + '\n')
          PY

      - name: Check whether Firebase is configured for this application ID
        id: firebase
        working-directory: flutter_app/android/app
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, pathlib
          path = pathlib.Path('google-services.json')
          packages = []
          if path.exists():
              try:
                  data = json.loads(path.read_text())
                  packages = [
                      client.get('client_info', {}).get('android_client_info', {}).get('package_name')
                      for client in data.get('client', [])
                  ]
              except Exception:
                  pass
          configured = 'com.mocktester.app' in packages
          print(f'configured={str(configured).lower()}')
          if not configured:
              print('::warning title=Push notifications disabled::Replace google-services.json with the Firebase Android configuration for com.mocktester.app to enable FCM.')
          PY

      - name: Resolve Flutter dependencies and launcher icons
        working-directory: flutter_app
        run: |
          flutter pub get
          dart run flutter_launcher_icons

      - name: Validate package, target API, manifest, and signing configuration
        working-directory: flutter_app/android/app
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/play-release/upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          grep -Fq 'applicationId = "com.mocktester.app"' build.gradle.kts
          grep -Fq 'targetSdk = 36' build.gradle.kts
          grep -Fq 'compileSdk = 36' build.gradle.kts
          grep -Fq 'signingConfig = signingConfigs.getByName("release")' build.gradle.kts
          ! grep -qi 'signingConfigs.getByName("debug")' build.gradle.kts
          grep -Fq 'android:usesCleartextTraffic="false"' src/main/AndroidManifest.xml
          ! grep -Eq 'READ_MEDIA_(IMAGES|VIDEO|AUDIO)|READ_EXTERNAL_STORAGE|WRITE_EXTERNAL_STORAGE|requestLegacyExternalStorage' src/main/AndroidManifest.xml
          keytool -list -keystore "$KEYSTORE_PATH" -storepass "$KEYSTORE_PASSWORD" -alias "$KEY_ALIAS" >/dev/null

      - name: Analyze and test
        working-directory: flutter_app
        run: |
          set -euo pipefail
          analysis_log="$RUNNER_TEMP/flutter-analyze.log"
          set +e
          flutter analyze --no-pub --no-fatal-infos --fatal-warnings 2>&1 | tee "$analysis_log"
          analyze_status=${PIPESTATUS[0]}
          set -e
          python3 - "$analysis_log" <<'PY_ANALYZER'
          import pathlib, re, sys

          def escape(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')

          log_path = pathlib.Path(sys.argv[1])
          ansi = re.compile(r'\x1b\[[0-?]*[ -/]*[@-~]')
          for raw_line in log_path.read_text(errors='replace').splitlines():
              raw = ansi.sub('', raw_line)
              parts = raw.split(' • ')
              if not parts:
                  continue
              severity = parts[0].strip()
              if severity not in {'info', 'warning', 'error'}:
                  continue
              if len(parts) < 4:
                  print(f'::notice title=Flutter analyzer::{escape(raw)}')
                  continue
              location = parts[-2].strip()
              match = re.match(r'^(.*):(\d+):(\d+)$', location)
              if not match:
                  print(f'::{"error" if severity == "error" else "warning" if severity == "warning" else "notice"} title=Flutter analyzer::{escape(raw)}')
                  continue
              file_path, line, column = match.groups()
              if file_path.startswith('/'):
                  marker = '/flutter_app/'
                  file_path = file_path.split(marker, 1)[-1] if marker in file_path else file_path
              if not file_path.startswith('flutter_app/'):
                  file_path = f'flutter_app/{file_path}'
              message = parts[1].strip()
              rule = parts[-1].strip()
              print(
                  f'::{"error" if severity == "error" else "warning" if severity == "warning" else "notice"} file={escape(file_path)},line={line},col={column},'
                  f'title=Flutter analyzer ({severity})::{escape(message)} [{escape(rule)}]'
              )
          PY_ANALYZER
          if [ "$analyze_status" -ne 0 ]; then
            echo "::error title=Flutter analyzer::flutter analyze exited with status $analyze_status."
            exit "$analyze_status"
          fi
          if [ -d test ] && find test -type f -name '*_test.dart' -print -quit | grep -q .; then
            flutter test --no-pub
          else
            echo "No project Flutter tests; skipping unit tests."
          fi

      - name: Build signed Android APK
        working-directory: flutter_app
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/play-release/upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_CONFIGURED: ${{ steps.firebase.outputs.configured }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          clean_log="$RUNNER_TEMP/flutter-clean.log"
          set +e
          flutter clean 2>&1 | tee "$clean_log"
          clean_status=${PIPESTATUS[0]}
          set -e
          if [ "$clean_status" -ne 0 ]; then
            echo "::error title=Flutter clean::flutter clean failed with status $clean_status."
            exit "$clean_status"
          fi
          flutter pub get

          build_log="$RUNNER_TEMP/flutter-apk-build.log"
          set +e
          flutter build apk --release --no-pub \
            --build-number="$VERSION_CODE" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            --dart-define="FIREBASE_CONFIGURED=$FIREBASE_CONFIGURED" 2>&1 | tee "$build_log"
          build_status=${PIPESTATUS[0]}
          set -e
          if [ "$build_status" -ne 0 ]; then
            python3 - "$build_log" <<'PY_BUILD_ERROR'
          import os, pathlib, sys
          text = '\n'.join(pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()[-60:])
          for name in ('SUPABASE_URL', 'SUPABASE_ANON_KEY', 'KEYSTORE_PASSWORD', 'KEY_PASSWORD'):
              secret = os.environ.get(name, '')
              if secret:
                  text = text.replace(secret, '***')
          text = text[-8000:]
          escaped = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::error title=Flutter APK build failed::{escaped}')
          PY_BUILD_ERROR
            exit "$build_status"
          fi

          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ ! -s "$APK" ]; then
            echo "::error title=APK output::Flutter reported success but the APK is missing or empty: $APK"
            exit 1
          fi
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_SDK" ]; then
            echo "::error title=Android SDK::ANDROID_HOME and ANDROID_SDK_ROOT are both empty."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error title=APK signing verification::Could not find an executable apksigner under $ANDROID_SDK/build-tools."
            exit 1
          fi
          if ! "$APKSIGNER" verify --verbose "$APK"; then
            echo "::error title=APK signing verification::apksigner rejected the release APK."
            exit 1
          fi
          echo "APK_PATH=$APK" >> "$GITHUB_ENV"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MockTester_Android_APK_${{ steps.release.outputs.version_code }}
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      # The universal release APK is ~56 MB, above the Telegram Bot API's
      # 50 MB document cap, so an arm64-only signed build is produced just for
      # the chat delivery. The Play artifact above stays universal.
      - name: Build a compact arm64 signed APK for Telegram
        if: ${{ github.event_name == 'push' || inputs.send_to_telegram }}
        working-directory: flutter_app
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/play-release/upload-key.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          FIREBASE_CONFIGURED: ${{ steps.firebase.outputs.configured }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -uo pipefail
          ANDROID_SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          if [ -z "$ANDROID_SDK" ]; then
            echo "::error title=Android SDK::ANDROID_HOME and ANDROID_SDK_ROOT are both empty."
            exit 1
          fi
          APKSIGNER="$(find "$ANDROID_SDK/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          if [ ! -x "$APKSIGNER" ]; then
            echo "::error title=APK signing verification::Could not find an executable apksigner under $ANDROID_SDK/build-tools."
            exit 1
          fi

          compact_log="$RUNNER_TEMP/flutter-arm64-build.log"
          flutter build apk --release --no-pub \
            --split-per-abi --target-platform=android-arm64 \
            --build-number="$VERSION_CODE" \
            --dart-define="SUPABASE_URL=$SUPABASE_URL" \
            --dart-define="SUPABASE_ANON_KEY=$SUPABASE_ANON_KEY" \
            --dart-define="FIREBASE_CONFIGURED=$FIREBASE_CONFIGURED" 2>&1 | tee "$compact_log"
          build_status=${PIPESTATUS[0]}
          ARM64_APK="build/app/outputs/flutter-apk/app-arm64-v8a-release.apk"
          if [ "$build_status" -ne 0 ] || [ ! -s "$ARM64_APK" ]; then
            # The universal APK is still delivered (as split parts), so a compact
            # build failure degrades the chat delivery instead of failing the run.
            echo "::warning title=Compact arm64 APK::Build status $build_status; the universal APK will be sent in parts."
            python3 - "$compact_log" <<'PY_COMPACT_LOG'
          import os, pathlib, sys
          text = '\n'.join(pathlib.Path(sys.argv[1]).read_text(errors='replace').splitlines()[-40:])
          for name in ('SUPABASE_URL', 'SUPABASE_ANON_KEY', 'KEYSTORE_PASSWORD', 'KEY_PASSWORD'):
              secret = os.environ.get(name, '')
              if secret:
                  text = text.replace(secret, '***')
          escaped = text[-8000:].replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print(f'::warning title=Compact arm64 build log::{escaped}')
          PY_COMPACT_LOG
            exit 0
          fi
          if ! "$APKSIGNER" verify --verbose "$ARM64_APK"; then
            echo "::error title=APK signing verification::apksigner rejected the compact arm64 APK."
            exit 1
          fi
          echo "Compact arm64 APK: $(stat -c%s "$ARM64_APK") bytes"
          echo "TELEGRAM_APK_PATH=$ARM64_APK" >> "$GITHUB_ENV"

      - name: Send signed APK to Telegram
        if: ${{ github.event_name == 'push' || inputs.send_to_telegram }}
        working-directory: flutter_app
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_TO }}
          VERSION_CODE: ${{ steps.release.outputs.version_code }}
        run: |
          set -euo pipefail
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::error title=Telegram configuration::TELEGRAM_TOKEN and TELEGRAM_TO repository secrets are required."
            exit 1
          fi
          OUTPUT_DIR="build/app/outputs/flutter-apk"
          APK="${TELEGRAM_APK_PATH:-$OUTPUT_DIR/app-release.apk}"
          if [ ! -s "$APK" ]; then
            echo "::error title=Telegram upload::Signed APK is missing or empty: $APK"
            exit 1
          fi
          # The Bot API rejects documents above 50 MB, so anything larger is
          # split into parts the recipient rejoins with `cat`.
          SINGLE_LIMIT=49000000
          PART_SIZE=45000000
          ZIP_PATH="$OUTPUT_DIR/MockTester_Android_${VERSION_CODE}.zip"
          rm -f "$ZIP_PATH" "$ZIP_PATH".*.part
          zip -9 -j "$ZIP_PATH" "$APK"
          ZIP_SIZE=$(stat -c%s "$ZIP_PATH")
          echo "Telegram archive: $ZIP_PATH ($ZIP_SIZE bytes)"

          RESPONSE_FILE="$RUNNER_TEMP/telegram_response.json"
          CHECK_SCRIPT="$RUNNER_TEMP/telegram_check.py"
          cat > "$CHECK_SCRIPT" <<'PY_CHECK'
          import json, pathlib, sys
          status, response_path, document = sys.argv[1:]
          def escape(value):
              return value.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          body = pathlib.Path(response_path).read_text(errors='replace')
          if status != '200':
              print(f'::error title=Telegram upload failed::HTTP {escape(status)} for {escape(document)}: {escape(body[:800])}')
              sys.exit(1)
          try:
              payload = json.loads(body)
          except Exception as exc:
              print(f'::error title=Telegram upload failed::Could not parse the Bot API response: {escape(str(exc))}')
              sys.exit(1)
          if payload.get('ok') is not True:
              description = str(payload.get('description', 'Telegram rejected the document.'))
              print(f'::error title=Telegram upload failed::{escape(document)}: {escape(description)}')
              sys.exit(1)
          print(f'::notice title=Telegram upload::Telegram accepted {escape(document)} ({escape(body[:200])}).')
          PY_CHECK

          send_document() {
            local document="$1" caption="$2" response status
            echo "sending $document ($(stat -c%s "$document") bytes)"
            if ! response=$(curl -sS -w '\n%{http_code}' \
              -F "chat_id=$CHAT_ID" \
              -F "caption=$caption" \
              -F "document=@$document" \
              --connect-timeout 60 --max-time 900 --retry 5 --retry-delay 5 \
              "https://api.telegram.org/bot${BOT_TOKEN}/sendDocument"); then
              echo "::error title=Telegram upload::curl could not complete the Bot API request for $document."
              return 1
            fi
            status=$(printf '%s\n' "$response" | tail -n 1)
            printf '%s\n' "$response" | sed '$d' > "$RESPONSE_FILE"
            python3 "$CHECK_SCRIPT" "$status" "$RESPONSE_FILE" "$document"
          }

          RUN_URL="https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          if [ "$ZIP_SIZE" -le "$SINGLE_LIMIT" ]; then
            send_document "$ZIP_PATH" \
              "MockTester signed Android APK v$VERSION_CODE (ZIP; extract the APK to install). Full universal APK: $RUN_URL"
          else
            echo "::warning title=Telegram file-size limit::$ZIP_PATH is $ZIP_SIZE bytes, above the Bot API's 50 MB cap; sending it in parts."
            split --bytes="$PART_SIZE" --numeric-suffixes=1 --suffix-length=2 \
              --additional-suffix=.part "$ZIP_PATH" "$ZIP_PATH."
            PARTS=("$ZIP_PATH".*.part)
            if [ "${#PARTS[@]}" -lt 2 ] || [ ! -s "${PARTS[0]}" ]; then
              echo "::error title=Telegram upload::Splitting $ZIP_PATH produced ${#PARTS[@]} usable parts."
              exit 1
            fi
            TOTAL=${#PARTS[@]}
            INDEX=0
            for part in "${PARTS[@]}"; do
              INDEX=$((INDEX + 1))
              send_document "$part" \
                "MockTester signed Android APK v$VERSION_CODE — part $INDEX of $TOTAL. Save every part, then rejoin them (cat MockTester_Android_${VERSION_CODE}.zip.part-* > MockTester_Android_${VERSION_CODE}.zip) and extract the APK. Full universal APK: $RUN_URL"
            done
          fi
