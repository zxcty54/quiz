name: "Build MockTester Offline Android APK"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android NDK 26 & CMake
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --install "ndk;26.1.10909125" "cmake;3.22.1"

      - name: Re-generate Native Android Project Files
        working-directory: flutter_app
        run: flutter create . --platforms=android --org com --project-name testing

      - name: Get Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Inject Missing llama.cpp Submodule into Package Cache
        run: |
          git clone --depth 1 https://github.com/ggerganov/llama.cpp.git /tmp/llama_source
          LLAMA_DART_PKG=$(find /home/runner/.pub-cache/hosted/pub.dev/ -maxdepth 1 -name "llama_cpp_dart-*" | head -n 1)
          if [ -n "$LLAMA_DART_PKG" ] && [ -d "$LLAMA_DART_PKG" ]; then
            echo "Found llama_cpp_dart at: $LLAMA_DART_PKG"
            mkdir -p "$LLAMA_DART_PKG/src/llama.cpp"
            cp -r /tmp/llama_source/* "$LLAMA_DART_PKG/src/llama.cpp/"
            mkdir -p "$LLAMA_DART_PKG/llama.cpp"
            cp -r /tmp/llama_source/* "$LLAMA_DART_PKG/llama.cpp/"
          fi

      - name: Perfectly Inject Desugaring & SDK 36 Configuration
        run: |
          python3 - << 'EOF'
          import os, glob

          # 1. Update Gradle Build Files to compileSdk 36
          for path in glob.glob("flutter_app/android/**/build.gradle*", recursive=True):
              if not os.path.isfile(path): continue
              with open(path, "r") as f:
                  content = f.read()
              
              # SDK update (compileSdk 36 is required for modern plugins)
              content = content.replace("minSdk = flutter.minSdkVersion", "minSdk = 24")
              content = content.replace("minSdkVersion flutter.minSdkVersion", "minSdkVersion 24")
              content = content.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
              content = content.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
              content = content.replace("targetSdk = flutter.targetSdkVersion", "targetSdk = 36")
              content = content.replace("targetSdkVersion flutter.targetSdkVersion", "targetSdkVersion 36")
              
              with open(path, "w") as f:
                  f.write(content)

          # 2. Inject Desugaring into app/build.gradle or app/build.gradle.kts
          kts_path = "flutter_app/android/app/build.gradle.kts"
          groovy_path = "flutter_app/android/app/build.gradle"

          if os.path.exists(kts_path):
              with open(kts_path, "r") as f:
                  content = f.read()
              if "isCoreLibraryDesugaringEnabled" not in content:
                  content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
                  content += '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.0.4")\n}\n'
                  with open(kts_path, "w") as f:
                      f.write(content)
              print("Successfully injected Desugaring in Kotlin DSL (build.gradle.kts)")

          if os.path.exists(groovy_path):
              with open(groovy_path, "r") as f:
                  content = f.read()
              if "coreLibraryDesugaringEnabled" not in content:
                  content = content.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
                  content += '\ndependencies {\n    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"\n}\n'
                  with open(groovy_path, "w") as f:
                      f.write(content)
              print("Successfully injected Desugaring in Groovy DSL (build.gradle)")
          EOF

      - name: Setup Keystore & Permissions
        working-directory: flutter_app/android
        run: |
          chmod +x gradlew || true
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            || true

      - name: Build Pure Offline Release APK (ARM64)
        working-directory: flutter_app
        run: |
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Auto-Rename APK & Compress
        working-directory: flutter_app
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} (Offline LLM + ARM64) APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
