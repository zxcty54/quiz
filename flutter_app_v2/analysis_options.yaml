include: package:flutter_lints/flutter.yaml

analyzer:
  errors:
    # Hard requirements surfaced by CI (errors fail the build, the rest is
    # reported in the analyze-log artefact).
    avoid_print: info
    use_build_context_synchronously: info
    deprecated_member_use: info
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"

linter:
  rules:
    # Kept from flutter_lints; the port only adds a few high-signal rules and
    # deliberately avoids pure-stylistic churn on 45k lines of legacy code.
    avoid_print: true
    unnecessary_parenthesis: true
