- name: Fix Desugaring for flutter_local_notifications
        run: |
          # Kotlin DSL build.gradle.kts फिक्स
          if [ -f "flutter_app/android/app/build.gradle.kts" ]; then
            python3 -c '
          with open("flutter_app/android/app/build.gradle.kts", "r") as f:
              content = f.read()

          if "isCoreLibraryDesugaringEnabled" not in content:
              content = content.replace("compileOptions {", "compileOptions {\n        isCoreLibraryDesugaringEnabled = true")
              content += "\ndependencies {\n    coreLibraryDesugaring(\"com.android.tools:desugar_jdk_libs:2.0.4\")\n}\n"

          with open("flutter_app/android/app/build.gradle.kts", "w") as f:
              f.write(content)
          '
          fi

          # Groovy build.gradle फिक्स
          if [ -f "flutter_app/android/app/build.gradle" ]; then
            python3 -c '
          with open("flutter_app/android/app/build.gradle", "r") as f:
              content = f.read()

          if "coreLibraryDesugaringEnabled" not in content:
              content = content.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              content += "\ndependencies {\n    coreLibraryDesugaring \"com.android.tools:desugar_jdk_libs:2.0.4\"\n}\n"

          with open("flutter_app/android/app/build.gradle", "w") as f:
              f.write(content)
          '
          fi

      - name: Build Pure Offline Release APK
        working-directory: flutter_app
        run: flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons