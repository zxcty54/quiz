name: "Build MockTester Offline Android APK"

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: "stable"
          cache: true

      - name: Setup Android SDK, NDK & CMake
        uses: android-actions/setup-android@v3

      - name: Install Android SDK Components
        run: |
          echo "y" | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager "platforms;android-34" "build-tools;34.0.0"

      - name: Get Dependencies
        working-directory: flutter_app
        run: flutter pub get

      - name: Configure MediaPipe GenAI & Gradle SDK 34
        run: |
          python3 - << 'EOF'
          import os

          # 1. Update Root android/build.gradle to force subprojects to SDK 34
          root_gradle = "flutter_app/android/build.gradle"
          if os.path.exists(root_gradle):
              with open(root_gradle, "r") as f:
                  content = f.read()
              
              override_block = """
          allprojects {
              repositories {
                  google()
                  mavenCentral()
              }
          }
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty('android')) {
                      project.android {
                          compileSdkVersion 34
                          defaultConfig {
                              targetSdkVersion 34
                          }
                      }
                  }
              }
          }
          """
              if "subprojects {" not in content:
                  content += override_block
                  with open(root_gradle, "w") as f:
                      f.write(content)
              print("Injected subproject SDK 34 override into root build.gradle")

          # 2. Inject MediaPipe GenAI & Desugaring into app/build.gradle
          groovy_path = "flutter_app/android/app/build.gradle"
          if os.path.exists(groovy_path):
              with open(groovy_path, "r") as f:
                  content = f.read()
              
              if "coreLibraryDesugaringEnabled" not in content:
                  content = content.replace("compileOptions {", "compileOptions {\n        coreLibraryDesugaringEnabled true")
              
              mediapipe_dep = """
          dependencies {
              coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.0.4"
              implementation 'com.google.mediapipe:tasks-genai:0.10.14'
          }
          """
              if "tasks-genai" not in content:
                  content += mediapipe_dep
                  with open(groovy_path, "w") as f:
                      f.write(content)
              print("Injected MediaPipe GenAI & Desugaring into app build.gradle")
          EOF

      - name: Setup Keystore & Permissions
        working-directory: flutter_app/android
        run: |
          chmod +x gradlew || true
          mkdir -p ~/.config/.android
          keytool -genkey -v \
            -keypass android \
            -keystore ~/.config/.android/debug.keystore \
            -alias AndroidDebugKey \
            -storepass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US" \
            || true

      - name: Build Pure Offline Release APK (ARM64)
        working-directory: flutter_app
        run: |
          flutter build apk --release --target-platform android-arm64 --no-tree-shake-icons

      - name: Upload Build Artifact (APK)
        uses: actions/upload-artifact@v4
        with:
          name: MockTester-Release-APK
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk

      - name: Auto-Rename APK & Compress
        working-directory: flutter_app
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk
          zip -9 -j build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.apk

      - name: Send Zip File Direct To Telegram
        uses: appleboy/telegram-action@master
        with:
          to: ${{ secrets.TELEGRAM_TO }}
          token: ${{ secrets.TELEGRAM_TOKEN }}
          message: "🚀 MockTester Build #${{ github.run_number }} (Google MediaPipe On-Device AI) APK Ready!"
          document: flutter_app/build/app/outputs/flutter-apk/MockTester_Build_${{ github.run_number }}.zip
